/* ---------- INSIGHT ---------- */
function renderInsight(){
  // 月度复盘：支持月份切换
  if(!insightMonth){ insightMonth=curYM(); }
  const [vy,vm]=insightMonth.split("-").map(Number);
  const monthName=`${vy}年${vm}月`;

  const cards=CONFIG.modules.map(m=>{ const it=data[m.key]||[]; let main="", pct=0;
    if(m.type==="todo"){ main=`${it.filter(x=>x.done).length}/${it.length} 已完成`; pct=it.length?Math.round(it.filter(x=>x.done).length/it.length*100):0; }
    else if(m.type==="checkin"){ const t=today(); main=`今日 ${it.filter(x=>x.log&&x.log[t]).length}/${it.length} 打卡`; pct=it.length?Math.round(it.filter(x=>x.log&&x.log[t]).length/it.length*100):0; }
    else if(m.type==="progress"){ pct=avgProgress(it).value; main=`平均进度 ${pct}%`; }
    else if(m.type==="finance"){ const e=it.filter(x=>x.type==="expense").reduce((a,x)=>a+ +x.amount,0); const inc=it.filter(x=>x.type==="income").reduce((a,x)=>a+ +x.amount,0); main=`收 ¥${inc} · 支 ¥${e}`; }
    else main=`${it.length} 条记录`;
    return `<div class="pin" data-open="${m.key}" style="cursor:pointer">
      <span class="pin-ic" style="color:${m.color};background:${m.tint};border-color:transparent">${icon(m.icon,19)}</span>
      <div class="pin-b"><div class="pin-t">${m.name}</div><div class="pin-m">${main}</div>
      ${['progress','todo','checkin'].includes(m.type)?`<div class="hero-bar" style="margin-top:9px"><i style="width:${pct}%;background:${m.color}"></i></div>`:''}</div>
      <span class="arw" style="color:var(--text-tertiary)">${icon("chevron",16,2)}</span></div>`; }).join("");

  // === 月度复盘板块 ===
  const budget=data.__budget||{};
  // 阅读 / 锻炼：current 累计 vs monthGoal
  const progressReview=(key,label,unit)=>{
    const arr=(data[key]||[]).filter(x=>x.monthGoal);
    if(!arr.length) return "";
    const rows=arr.map(x=>{
      const cur=+x.current||0; const goal=+x.monthGoal||0;
      const pct=goal?Math.min(100,Math.round(cur/goal*100)):0;
      const cls=pct>=100?"done":(pct>=60?"ok":"warn");
      return `<div class="rv-row ${cls}">
        <div class="rv-name">${esc(x.title||"")}</div>
        <div class="rv-bar"><i style="width:${pct}%"></i></div>
        <div class="rv-val">${cur}<span class="rv-g">/${goal} ${unit}</span></div>
        <div class="rv-pct ${cls}">${pct}%</div>
      </div>`;
    }).join("");
    return `<div class="rv-card"><div class="rv-hd">${icon(key==="read"?"book":"activity",15)} ${label}</div>${rows}</div>`;
  };
  // 打卡：本月已打卡天数 vs monthGoal
  const checkinReview=()=>{
    const arr=(data.checkin||[]).filter(x=>x.monthGoal);
    if(!arr.length) return "";
    const [yy,mm]=insightMonth.split("-").map(Number);
    const daysInMonth=new Date(yy,mm,0).getDate();
    const countDays=(log)=>{
      if(!log) return 0;
      return Object.keys(log).filter(d=>d.startsWith(insightMonth)).length;
    };
    const rows=arr.map(x=>{
      const cnt=countDays(x.log); const goal=+x.monthGoal||0;
      const pct=goal?Math.min(100,Math.round(cnt/goal*100)):0;
      const cls=pct>=100?"done":(pct>=60?"ok":"warn");
      return `<div class="rv-row ${cls}">
        <div class="rv-name">${esc(x.title||"")}</div>
        <div class="rv-bar"><i style="width:${pct}%"></i></div>
        <div class="rv-val">${cnt}<span class="rv-g">/${goal} 天</span></div>
        <div class="rv-pct ${cls}">${pct}%</div>
      </div>`;
    }).join("");
    return `<div class="rv-card"><div class="rv-hd">${icon("leaf",15)} 习惯打卡</div>${rows}</div>`;
  };
  // 记账：本月支出 vs 预算
  const financeReview=()=>{
    const bud=budget.expense||0;
    if(!bud) return "";
    const exp=(data.money||[]).filter(x=>x.type==="expense" && (x.date||"").startsWith(insightMonth))
      .reduce((a,x)=>a+ +x.amount,0);
    const pct=bud?Math.min(100,Math.round(exp/bud*100)):0;
    const cls=pct>=100?"warn":(pct>=80?"warn":(pct>=60?"ok":"ok"));
    return `<div class="rv-card"><div class="rv-hd">${icon("wallet",15)} 月度预算</div>
      <div class="rv-row ${cls}">
        <div class="rv-name">本月支出</div>
        <div class="rv-bar"><i style="width:${pct}%"></i></div>
        <div class="rv-val">¥${exp}<span class="rv-g">/¥${bud}</span></div>
        <div class="rv-pct ${cls}">${pct}%</div>
      </div></div>`;
  };

  // 预算编辑入口
  const budgetEditor=`
    <div class="rv-budget">
      <span class="rvb-label">${icon("wallet",13)} 本月预算 ¥</span>
      <input id="rv-budget" type="number" value="${budget.expense||""}" placeholder="设置预算（如 2000）"/>
      <button class="btn" id="rv-budget-save">保存</button>
    </div>`;

  // 投资复盘 + 净资产聚合（月底自动写入资产快照）
  maybeSnapshotAsset();
  const investHTML=investmentReviewHTML();
  const reviews=[progressReview("read","阅读进度","页"),progressReview("sport","锻炼累计","分钟"),checkinReview(),financeReview(),investHTML].filter(Boolean).join("");
  const hasReviews=!!reviews;

  const [cy,cm]=curYM().split("-").map(Number);
  const canPrev=true;
  const isCurMonth=insightMonth===curYM();
  const canNext=!isCurMonth;

  $("#screen").innerHTML=`<div class="header"><div><h2>洞察</h2><p>各模块进展一览 · 记录—执行—统计—反馈</p></div><div class="spacer"></div><span class="date-chip">${icon("calendar",14)} ${dateStr()}</span></div>
    <div class="sec-title">模块概况</div><div class="pin-list" style="grid-template-columns:repeat(3,1fr)">${cards}</div>

    <div class="sec-title" style="margin-top:28px">
      <div class="rv-title">${icon("target",16)} 月度复盘 · ${monthName}</div>
      <div class="rv-month-nav">
        <button class="btn ghost" id="rv-prev" ${canPrev?'':'disabled'}>${icon("chevron",13)} 上月</button>
        <span class="rv-month-name">${monthName}</span>
        <button class="btn ghost" id="rv-next" ${canNext?'':'disabled'}>下月 ${icon("chevron",13)}</button>
      </div>
    </div>
    ${hasReviews?`<div class="rv-grid">${reviews}</div>`:`<div class="focus-empty" style="margin:10px 0">还没有设置月度目标 — 到「阅读」「锻炼」「习惯打卡」编辑器里填入「月度目标」字段，或设置「本月预算」</div>`}
    ${budgetEditor}`;

  $("#screen").querySelectorAll("[data-open]").forEach(el=>el.onclick=()=>go(el.dataset.open));
  // 月份切换
  const prev=$("#rv-prev"); if(prev) prev.onclick=()=>{
    let [yy,mm]=insightMonth.split("-").map(Number);
    mm--; if(mm<1){ mm=12; yy--; }
    insightMonth=`${yy}-${String(mm).padStart(2,"0")}`; renderInsight();
  };
  const nxt=$("#rv-next"); if(nxt) nxt.onclick=()=>{
    let [yy,mm]=insightMonth.split("-").map(Number);
    mm++; if(mm>12){ mm=1; yy++; }
    insightMonth=`${yy}-${String(mm).padStart(2,"0")}`; renderInsight();
  };
  // 保存预算
  const bs=$("#rv-budget-save"); if(bs) bs.onclick=()=>{
    data.__budget=data.__budget||{};
    data.__budget.expense=Math.max(0,+($("#rv-budget").value)||0);
    store.save(); renderInsight();
  };
}
let insightMonth=""; // 切换的月份 YYYY-MM
function curYM(){ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`; }

/* ---------- MODULE VIEW ---------- */
function renderModule(key){
  const m=modOf(key); const all=data[key]||[]; let it=all;
  if(m.type==="timetable"){ renderTimetable(key); return; }
  const t=today();
  const q=searchQ.trim().toLowerCase();
  if(q) it=all.filter(x=>(x.title||"").toLowerCase().includes(q)||(x.note||x.content||"").toLowerCase().includes(q));

  // 待办支持 清单/日历 视图切换
  const todoView = (m.type==="todo") ? (todoViewMode||"list") : "list";

  let head="";
  if(m.type==="finance"){
    const inc=all.filter(x=>x.type==="income").reduce((a,x)=>a+ +x.amount,0);
    const exp=all.filter(x=>x.type==="expense").reduce((a,x)=>a+ +x.amount,0);
    head=`<div class="mod-summary">
      <div class="mini"><div class="l">收入</div><div class="v" style="color:var(--module-1)">¥${inc}</div></div>
      <div class="mini"><div class="l">支出</div><div class="v" style="color:var(--danger)">¥${exp}</div></div>
      <div class="mini"><div class="l">结余</div><div class="v">¥${inc-exp}</div></div>
      <div class="mini"><div class="l">笔数</div><div class="v">${all.length}</div></div></div>`;
  } else if(m.type==="todo"){
    const done=all.filter(x=>x.done).length;
    head=headHero(m, `${done}/${all.length}`, "今日已完成");
  } else if(m.type==="checkin"){
    const done=all.filter(x=>x.log&&x.log[t]).length;

  } else if(m.type==="progress"){
    const p=avgProgress(all);
    head=headHero(m, `${p.value}%`, `平均进度 · ${all.length} 项`);
  } else if(m.type==="note"){
    const todayN=all.filter(x=>x.date===t).length;
    head=headHero(m, `${all.length}`, `条记录 · 今日 ${todayN} 条`, null);
  }

  // 视图切换按钮（仅 todo 显示）

  } else {
    const body = it.length ? it.map(x=>recHTML(m,x)).join("")

    mainContent = `<div class="sec-title">${m.type==="todo"?"全部任务":"全部记录"} <span id="rec-count" style="margin-left:auto;font-weight:500;color:var(--text-secondary);font-size:12px">${it.length} 条</span></div>
      <div class="rec-grid">${body}</div>`;

    <div class="toolbar">
      <div class="search-box">${icon("search",15,2.2)}<input id="search" placeholder="搜索…" value="${attr(searchQ)}"/></div>
      ${viewSwitcher}

    ${head}
    <div class="mod-layout">
      <div class="mod-main">${mainContent}</div>
      <aside class="mod-side">${sideStats(m,all)}</aside>
    </div>`;
  const s=$("#search");

  const refresh=()=>{ searchQ=s.value; renderModuleResults(key); };
  s.addEventListener("compositionstart",()=>{ composing=true; });
  s.addEventListener("compositionend",()=>{ composing=false; refresh(); });
  s.addEventListener("input",()=>{ if(!composing) refresh(); });
  // 视图切换
  if(m.type==="todo"){
    $("#screen").querySelectorAll("#todo-view .opt").forEach(o=>o.onclick=()=>{
      todoViewMode=o.dataset.v;
      renderModule(key);
    });

    });
  }
  $("#btn-new").onclick=()=>openEditor(key,null);
  wireModule(key);
}

/* 待办日历视图（月历） */
let todoViewMode="list"; // list | calendar
function renderTodoCalendar(key, all, q){
  const todayStr=isoToday();
  const now=new Date();
  // 当月第一天的星期（0=周日）
  const y=now.getFullYear(), mo=now.getMonth();
  const first=new Date(y,mo,1);
  const firstDow=first.getDay(); // 0=周日
  const daysInMonth=new Date(y,mo+1,0).getDate();
  // 转换为周一开始的偏移
  const offset=(firstDow+6)%7; // 周一=0
  // 上月补齐的天数
  const prevDays=Array.from({length:offset},(_,i)=>{
    const d=new Date(y,mo, i-offset+1);
    return d.toISOString().slice(0,10);
  });
  const monthDays=Array.from({length:daysInMonth},(_,i)=>{
    const d=new Date(y,mo,i+1);
    return d.toISOString().slice(0,10);
  });
  const cells=[...prevDays, ...monthDays];
  // 补齐到 6 行 42 格
  while(cells.length<42){ const d=new Date(y,mo,daysInMonth+(cells.length-offset-monthDays.length)+1); cells.push(d.toISOString().slice(0,10)); }

  // 按 date 分组待办
  const byDate={};
  all.forEach(x=>{
    const dt=x.date||todayStr;
    (byDate[dt]=byDate[dt]||[]).push(x);
  });

  const dowHd=["一","二","三","四","五","六","日"]
    .map(d=>`<div class="cal-dow">${d}</div>`).join("");

  const grid=cells.map(dt=>{
    const dayNum=+dt.slice(8,10);
    const isToday=dt===todayStr;
    const isCurMonth=dt.slice(0,7)===`${y}-${String(mo+1).padStart(2,'0')}`;
    const list=(byDate[dt]||[]).filter(x=>{
      if(!q) return true;
      return (x.title||"").toLowerCase().includes(q) || (x.note||"").toLowerCase().includes(q);
    });
    const items=list.slice(0,3).map(x=>{
      const p=(CONFIG.modules.find(m=>m.key==="todo").priorities||[]).find(p=>p.key===x.priority);
      const pc=p?p.text:"var(--text-tertiary)";
      return `<div class="cal-item ${x.done?'done':''}" data-id="${x.id}" style="border-left:3px solid ${pc}">
        ${x.time?`<span class="cal-time">${esc(x.time)}</span>`:''}
        <span class="cal-txt">${esc(x.title||"")}</span>
      </div>`;
    }).join("");
    const more=list.length>3?`<div class="cal-more">+${list.length-3}</div>`:'';
    return `<div class="cal-day ${isToday?'today':''} ${isCurMonth?'':'other-month'}" data-add-date="${dt}">
      <div class="cal-day-num">${dayNum}</div>
      <div class="cal-items">${items}${more}</div>
    </div>`;
  }).join("");

  const monthNames=["1月","2月","3月","4月","5月","6月","7月","8月","9月","10月","11月","12月"];
  return `<div class="todo-cal">
    <div class="cal-month-hd"><span class="cal-month-title">${y}年 ${monthNames[mo]}</span>
      <span class="cal-month-sub">点击空白日期添加 · 点击任务编辑 · 优先级用左侧色条标识</span></div>
    <div class="cal-dow-row">${dowHd}</div>
    <div class="cal-grid">${grid}</div>
  </div>`;
}

/* ---------- 课表专用渲染 ---------- */
function renderTimetable(key){
  const m=modOf(key); const all=data[key]||[];
  const days=["周一","周二","周三","周四","周五","周六","周日"];
  const dayKeys=[1,2,3,4,5,6,7];
  const today_dow=((new Date().getDay()+6)%7)+1; // 1=周一
  // 分离固定节次课程与自定义时段课程
  const fixed=all.filter(x=>!x.customSlot);
  const custom=all.filter(x=>!!x.customSlot);
  const total=fixed.filter(x=>x.tag!=="tutoring").length;
  const tutoringCount=fixed.filter(x=>x.tag==="tutoring").length;
  const customCount=custom.length;

  // 构建查找表: day+period → item (仅固定节次)
  const lookup={};
  fixed.forEach(x=>{ lookup[(x.day||1)+"_"+(x.period||1)]=x; });

  // 表头行
  const headRow=`<div class="tt-pd" style="font-weight:700;color:var(--text-secondary)">节次</div>`
    + days.map((d,i)=>{
      const cls=dayKeys[i]===today_dow?"tt-hd today":"tt-hd";
      return `<div class="${cls}">${d}</div>`;
    }).join("");

  // 按 TT_ROWS 顺序构建行（含课间休息）
  const rows=TT_ROWS.map(r=>{
    if(r.type==="break"){
      return `<div class="tt-break"><div class="tt-pd"></div><div class="tt-break-label">${esc(r.label)} <span class="tt-break-time">${esc(r.time||"")}</span></div></div>`;
    }
    // period 行
    const p=r.period;
    const time=TT_PERIOD_TIME[p]||"";
    const rowHead=`<div class="tt-pd"><span class="tt-period">第${p}节</span>${time?`<span class="tt-time">${esc(time)}</span>`:''}</div>`;
    const cells=dayKeys.map(d=>{
      const item=lookup[d+"_"+p];
      const isTutoring=item&&item.tag==="tutoring";
      const cls="tt-cell"+(d===today_dow?" today":"")+(isTutoring?" tutoring":"");
      if(item){
        return `<div class="${cls}" data-edit="${item.id}">
          ${isTutoring?`<span class="tt-tag">补习</span>`:''}
          <div class="tt-sub">${esc(item.subject||"")}</div>
          ${item.location?`<div class="tt-loc">${icon("map-pin",10)} ${esc(item.location)}</div>`:''}
          ${item.teacher?`<div class="tt-teacher">${esc(item.teacher)}</div>`:''}
          ${item.note?`<div class="tt-note">${esc(item.note)}</div>`:''}
          <button class="tt-del js-del" data-id="${item.id}" title="删除">&times;</button>
        </div>`;
      }
      return `<div class="${cls} empty" data-add-day="${d}" data-add-period="${p}">+</div>`;
    }).join("");
    return rowHead+cells;
  }).join("");

  // 自定义时段分区（按星期分组）
  let customSection="";
  if(customCount){
    const byDay={};
    custom.forEach(x=>{ (byDay[x.day||1]=byDay[x.day||1]||[]).push(x); });
    const cards=dayKeys.map(d=>{
      const list=(byDay[d]||[]).sort((a,b)=>(a.startTime||"").localeCompare(b.startTime||""));
      if(!list.length) return "";
      const cells=list.map(x=>{
        const isTutoring=x.tag==="tutoring";
        const cls="tt-cell custom"+(d===today_dow?" today":"")+(isTutoring?" tutoring":"");
        return `<div class="${cls}" data-edit="${x.id}">
          ${isTutoring?`<span class="tt-tag">补习</span>`:''}
          <div class="tt-time-range">${icon("clock",11)} ${esc(x.startTime||"?")}-${esc(x.endTime||"?")}</div>
          <div class="tt-sub">${esc(x.subject||"")}</div>
          ${x.location?`<div class="tt-loc">${icon("map-pin",10)} ${esc(x.location)}</div>`:''}
          ${x.teacher?`<div class="tt-teacher">${esc(x.teacher)}</div>`:''}
          ${x.note?`<div class="tt-note">${esc(x.note)}</div>`:''}
          <button class="tt-del js-del" data-id="${x.id}" title="删除">&times;</button>
        </div>`;
      }).join("");
      return `<div class="tt-day-col"><div class="tt-day-hd ${d===today_dow?'today':''}">${days[d-1]}</div><div class="tt-day-cells">${cells}</div></div>`;
    }).join("");
    customSection=`
      <div class="tt-custom-section">
        <div class="tt-section-hd"><span class="tt-section-title">${icon("clock",16)} 自定义时段</span><span class="tt-section-sub">课外补习 / 提前约课 · 共 ${customCount} 节</span></div>
        <div class="tt-day-grid">${cards}</div>
      </div>`;
  }

  const head=headHero(m, `${total}`, `节正课 · 本周${tutoringCount?` · ${tutoringCount}节补习`:''}${customCount?` · ${customCount}节自定义`:''}`, null);

  $("#screen").innerHTML=`<div class="header"><div><h2>${m.name}</h2><p>${m.desc}</p></div><div class="spacer"></div><span class="date-chip">${icon("calendar",14)} ${dateStr()}</span></div>
    <div class="toolbar">
      <div style="font-size:12px;color:var(--text-secondary)">点击空白格添加课程 · 点击课程编辑 · 鼠标悬停显示删除 · <span style="color:var(--module-5);font-weight:700">紫色</span>为补习课</div>
      <div class="spacer"></div>
      <button class="btn" id="btn-new">${icon("plus",16,2.2)}新建课程</button></div>
    ${head}
    <div class="tt-grid" style="grid-template-columns:60px repeat(7,1fr)">${headRow}${rows}</div>
    ${customSection}`;

  $("#btn-new").onclick=()=>openEditor(key,null);
  $("#screen").querySelectorAll("[data-edit]").forEach(el=>el.onclick=()=>openEditor(key,(data[key]).find(i=>i.id==el.dataset.edit)));
  $("#screen").querySelectorAll("[data-add-day]").forEach(el=>el.onclick=()=>openTimetableQuick(key,null,+el.dataset.addDay,+el.dataset.addPeriod));
  $("#screen").querySelectorAll(".js-del").forEach(el=>el.onclick=e=>{ e.stopPropagation(); confirmDelete(key, el.dataset.id); });
}

/* 模块统计侧栏：按 type 生成多维数据，填满右侧空间 */
function sideStats(m, all){
  const t=today();
  const palette=["var(--accent)","var(--module-1)","var(--module-2)","var(--module-3)","var(--module-4)","var(--module-5)","var(--danger)"];
  const row=(k,v,dot)=>`<div class="stat-row"><span class="k">${dot?`<span class="kd" style="background:${dot}"></span>`:''}${k}</span><span class="val">${v}</span></div>`;

  if(m.type==="finance"){
    const inc=all.filter(x=>x.type==="income").reduce((a,x)=>a+ +x.amount,0);
    const exp=all.filter(x=>x.type==="expense").reduce((a,x)=>a+ +x.amount,0);
    // 支出按分类聚合
    const byCat={}; all.filter(x=>x.type==="expense").forEach(x=>{ const c=x.category||"其他"; byCat[c]=(byCat[c]||0)+ +x.amount; });
    const cats=Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
    const maxC=cats.length?cats[0][1]:1;
    const catBars=cats.length? cats.map((c,i)=>`<div class="cbrow"><span class="cbn">${esc(c[0])}</span><span class="cbt"><i style="width:${Math.round(c[1]/maxC*100)}%;background:${palette[i%palette.length]}"></i></span><span class="cbv">¥${c[1]}</span></div>`).join("")
      : `<div style="color:var(--text-tertiary);font-size:12.5px;padding:6px 0">暂无支出记录</div>`;
    const todayExp=all.filter(x=>x.type==="expense"&&x.date===t).reduce((a,x)=>a+ +x.amount,0);
    return `<div class="side-card"><div class="sh">${icon("wallet",15)} 收支概况</div>
        ${row("总收入",`<span style="color:var(--module-1)">¥${inc}</span>`)}
        ${row("总支出",`<span style="color:var(--danger)">¥${exp}</span>`)}
        ${row("净结余",`¥${inc-exp}`)}
        ${row("今日支出",`¥${todayExp}`)}
        ${row("总笔数",`${all.length} 笔`)}</div>
      <div class="side-card"><div class="sh">${icon("chart",15)} 支出分类占比</div><div class="catbar">${catBars}</div></div>`;
  }

  if(m.type==="progress"){
    const p=avgProgress(all);
    const doneN=all.filter(x=>((x.current/x.target)*100||0)>=100).length;
    const totalCur=all.reduce((a,x)=>a+ (+x.current||0),0);
    const totalTgt=all.reduce((a,x)=>a+ (+x.target||0),0);
    return `<div class="side-card"><div class="sh">${icon("target",15)} 总体进度</div>
        <div class="side-ring"><div class="dial">${ringSVG(p.value,m.color)}<span class="mid"><span class="big" style="color:${m.color}">${p.value}%</span><span class="cap">平均进度</span></span></div></div></div>
      <div class="side-card"><div class="sh">${icon("list",15)} 数据统计</div>
        ${row("进行项目",`${all.length} 项`)}
        ${row("已达成",`${doneN} 项`)}
        ${row("累计完成",`${totalCur} ${all[0]?.unit||m.unit||''}`)}
        ${row("总目标量",`${totalTgt} ${all[0]?.unit||m.unit||''}`)}</div>`;
  }

  if(m.type==="checkin"){
    const done=all.filter(x=>x.log&&x.log[t]).length; const pct=all.length?Math.round(done/all.length*100):0;
    const streaks=all.map(x=>({title:x.title,s:streak(x.log)})).sort((a,b)=>b.s-a.s);
    const best=streaks[0]?streaks[0].s:0;
    const list=streaks.slice(0,6).map(x=>`<div class="stat-row"><span class="k">${esc(x.title)}</span><span class="val" style="color:var(--module-3)">${x.s} 天</span></div>`).join("");
    return `<div class="side-card"><div class="sh">${icon("leaf",15)} 今日打卡</div>
        <div class="side-ring"><div class="dial">${ringSVG(pct,m.color)}<span class="mid"><span class="big" style="color:${m.color}">${done}/${all.length}</span><span class="cap">已完成</span></span></div></div></div>
      <div class="side-card"><div class="sh">${icon("flame",15)} 连续天数</div>
        ${row("最长连续",`<span style="color:var(--module-3)">${best} 天</span>`)}
        ${row("习惯总数",`${all.length} 个`)}
        <div style="margin-top:6px">${list}</div></div>`;
  }

  if(m.type==="todo"){
    const done=all.filter(x=>x.done).length; const pct=all.length?Math.round(done/all.length*100):0;
    const byP={}; (m.priorities||[]).forEach(p=>byP[p.key]=0); all.forEach(x=>{ if(byP[x.priority]!=null) byP[x.priority]++; });
    const pRows=(m.priorities||[]).map(p=>`<div class="stat-row"><span class="k"><span class="kd" style="background:${p.text}"></span>${p.label}</span><span class="val">${byP[p.key]||0} 项</span></div>`).join("");
    return `<div class="side-card"><div class="sh">${icon("list",15)} 完成情况</div>
        <div class="side-ring"><div class="dial">${ringSVG(pct,m.color)}<span class="mid"><span class="big" style="color:${m.color}">${pct}%</span><span class="cap">${done}/${all.length} 完成</span></span></div></div></div>
      <div class="side-card"><div class="sh">${icon("chart",15)} 优先级分布</div>
        ${pRows}
        ${row("剩余待办",`${all.length-done} 项`)}</div>`;
  }

  // note
  const todayN=all.filter(x=>x.date===t).length;
  const byMood={}; all.forEach(x=>{ const md=x.mood||"未分类"; byMood[md]=(byMood[md]||0)+1; });
  const moods=Object.entries(byMood).sort((a,b)=>b[1]-a[1]);
  const maxM=moods.length?moods[0][1]:1;
  const moodBars=moods.length? moods.map((c,i)=>`<div class="cbrow"><span class="cbn">${esc(c[0])}</span><span class="cbt"><i style="width:${Math.round(c[1]/maxM*100)}%;background:${palette[i%palette.length]}"></i></span><span class="cbv">${c[1]} 条</span></div>`).join("")
    : `<div style="color:var(--text-tertiary);font-size:12.5px;padding:6px 0">暂无记录</div>`;
  return `<div class="side-card"><div class="sh">${icon("pen",15)} 记录统计</div>
      ${row("累计记录",`${all.length} 条`)}
      ${row("今日新增",`${todayN} 条`)}
      ${row("标签种类",`${moods.length} 种`)}</div>
    <div class="side-card"><div class="sh">${icon("chart",15)} 标签分布</div><div class="catbar">${moodBars}</div></div>`;
}

/* per-module hero header: icon + big number + label */
function headHero(m, big, label){
  const inner=`<div class="hero-ic" style="background:${m.tint};color:${m.color}">${icon(m.icon,24)}</div>
    <div class="hero-tx"><div class="hero-row"><span class="hero-v">${big}</span><span class="hero-l">${label}</span></div></div>`;

function recHTML(m,x){
  const pin=`<button class="pin-btn js-pin ${x.pinned?'on':''}" data-id="${x.id}" title="置顶">${icon("star",15)}</button>`;
  const del=`<button class="del js-del" data-id="${x.id}" title="删除">${icon("trash",15)}</button>`;
  const acts=`<div class="acts">${pin}${del}</div>`;
  const chkMark=icon("check",13,2.4);
  const thumb=x.image?`<img class="thumb" src="${attr(x.image)}" alt="">`:'';
  const customMeta=(m.fields||[]).filter(f=>x[f.key]).map(f=>`<span class="meta-tag">${esc(x[f.key])}</span>`).join("");
  const customBlock=customMeta?`<div class="meta-line">${customMeta}</div>`:'';
  const layout=x.layout||'default';
  const layoutCls=`rec-layout-${layout}`;

  // feature layout: 大图在上 + 标题 + 正文在下 (适合有图记录)
  if(layout==='feature' && x.image){
    const body=(x.content||x.note||'').trim();
    return `<div class="rec ${layoutCls}">${acts}<div class="top" data-edit="${x.id}">
      ${thumb}
      <div class="feat-title">${esc(x.title||'无标题')}</div>
      ${body?`<div class="feat-body">${esc(body)}</div>`:''}
      ${customBlock?`<div style="padding:0 16px 14px">${customBlock}</div>`:''}</div></div>`;
  }
  // quote layout: 大字居中 (适合短文本/灵感/金句)
  if(layout==='quote'){
    const text=(x.content||x.title||'').trim();
    return `<div class="rec ${layoutCls}">${acts}<div class="top" data-edit="${x.id}" style="flex-direction:column;align-items:center;text-align:center">
      <div class="quote-text">${esc(text)}</div>
      ${x.mood?`<div class="quote-meta">${esc(x.mood)}${x.date?` · ${esc(x.date)}`:''}</div>`:(x.date?`<div class="quote-meta">${esc(x.date)}</div>`:'')}
      ${customBlock?`<div style="margin-top:8px">${customBlock}</div>`:''}</div></div>`;
  }

  // default layout
  if(m.type==="todo"){ const p=(m.priorities||[]).find(p=>p.key===x.priority);
    return `<div class="rec ${layoutCls}">${acts}<div class="top" style="padding-right:60px"><div class="chk js-chk ${x.done?'on':''}" data-id="${x.id}">${chkMark}</div>
      ${thumb}
      <div class="body" data-edit="${x.id}"><span class="rname ${x.done?'done':''}">${esc(x.title)}</span>
      ${p?`<span class="badge" style="background:${p.color};color:${p.text}"><span class="dot"></span>${p.label}</span>`:''}
      ${x.note?`<span class="rdate" style="margin-left:0;color:var(--text-tertiary)">${esc(x.note).slice(0,40)}</span>`:''}${customBlock}</div></div></div>`; }
  if(m.type==="checkin"){ const on=!!(x.log&&x.log[today()]); const st=streak(x.log);
    return `<div class="rec ${layoutCls}">${acts}<div class="top" style="padding-right:60px"><div class="chk js-chk ${on?'on':''}" data-id="${x.id}">${chkMark}</div>
      ${thumb}
      <div class="body" data-edit="${x.id}"><span class="rname">${esc(x.title)}</span>
      <span class="streak">${icon("flame",13)} 连续 ${st} 天</span>${on?'<span class="badge" style="background:var(--accent-muted);color:var(--accent)">今日已打卡</span>':''}${customBlock}</div></div></div>`; }
  if(m.type==="progress"){ const pct=Math.min(100,Math.round((x.current/x.target)*100||0));
    // 阅读专属：阅后感 / 关键句 / 标签
    let readBlock="";
    if(m.key==="read"){
      const hasReflection=!!x.reflection;
      const hasQuotes=(x.quotes||[]).length>0;
      const hasTags=(x.tags||[]).length>0;
      if(hasReflection||hasQuotes||hasTags){
        readBlock=`<div class="read-meta">
          ${hasReflection?`<div class="rm-ref"><span class="rm-ic">${icon("book-open",12)}</span><span class="rm-txt">${esc(x.reflection.slice(0,80))}${x.reflection.length>80?'…':''}</span></div>`:''}
          ${hasQuotes?`<div class="rm-quotes">${(x.quotes||[]).slice(0,2).map(q=>`<div class="rm-q"><span class="rm-quote">${icon("quote",10)}</span><span class="rm-qtxt">${esc((q.text||"").slice(0,50))}${(q.text||"").length>50?'…':''}</span>${q.page?`<span class="rm-pg">P${q.page}</span>`:''}</div>`).join("")}${(x.quotes||[]).length>2?`<div class="rm-more">+${(x.quotes||[]).length-2}条摘录</div>`:''}</div>`:''}
          ${hasTags?`<div class="rm-tags">${(x.tags||[]).map(tg=>`<span class="rm-tag">${icon("tag",9)} ${esc(tg)}</span>`).join("")}</div>`:''}
        </div>`;
      }
    }
    return `<div class="rec ${layoutCls}">${acts}<div class="top" style="padding-right:60px">${thumb}<div class="body" data-edit="${x.id}">
      <span class="rname">${esc(x.title)}</span>
      <div class="pbar"><i style="width:${pct}%;background:${m.color}"></i></div>
      <span class="rdate" style="margin-left:0;color:var(--text-secondary)">${x.current}/${x.target} ${x.unit||m.unit||''} · ${pct}%</span>
      ${x.note?`<div class="rnote">${esc(x.note)}</div>`:''}${readBlock}${customBlock}</div></div></div>`; }
  if(m.type==="finance"){ const inc=x.type==="income";
    return `<div class="rec ${layoutCls}">${acts}<div class="top" style="padding-right:60px">${thumb}<div class="body" data-edit="${x.id}">
      <span class="rname">${esc(x.title)}</span>
      <span class="badge" style="background:var(--surface-nested);color:var(--text-secondary)">${esc(x.category||'其他')}</span>
      <span class="rdate">${x.date||''}</span>${customBlock}</div>
      <div class="amt ${inc?'inc':'exp'}">${inc?'+':'-'}¥${x.amount}</div></div></div>`; }
  // note
  const photoCount=(x.photos&&x.photos.length)||0;
  const hasAudio=!!x.audio;
  return `<div class="rec ${layoutCls}">${acts}<div class="top" style="padding-right:60px;flex-direction:column;align-items:stretch">
    <div class="body" data-edit="${x.id}" style="padding-bottom:4px">
      <span class="rname">${esc(x.title||'无标题')}</span>
      ${x.mood?`<span class="badge" style="background:var(--accent-muted);color:var(--accent)">${esc(x.mood)}</span>`:''}
      ${x.loc?`<span class="diary-loc">${icon("map-pin",12)}${esc(x.loc)}</span>`:''}
      ${x.content?`<span class="rdate" style="margin-left:0;color:var(--text-tertiary);display:block;margin-top:4px">${esc(x.content).slice(0,60)}${x.content.length>60?'…':''}</span>`:''}
      <span class="rdate">${x.date||''}</span>
    </div>
    ${photoCount?`<div class="diary-photos" data-photos="${attr(JSON.stringify(x.photos))}"></div>`:''}
    ${hasAudio?`<div class="diary-audio" data-audio="${attr(x.audio)}"><span class="a-label">${icon("music",13)} 录音</span></div>`:''}
    </div></div>`;
}

function streak(log){ if(!log) return 0; let n=0; const d=new Date();
  for(;;){ const k=d.toISOString().slice(0,10); if(log[k]){ n++; d.setDate(d.getDate()-1);} else break; } return n; }

function wireModule(key){ const m=modOf(key);
  $("#screen").querySelectorAll(".js-chk").forEach(el=>el.onclick=e=>{ e.stopPropagation();
    const x=(data[key]).find(i=>i.id==el.dataset.id);
    if(m.type==="todo") x.done=!x.done;
    else if(m.type==="checkin"){ x.log=x.log||{}; const t=today(); x.log[t]?delete x.log[t]:x.log[t]=true; }
    persist(); });
  $("#screen").querySelectorAll("[data-edit]").forEach(el=>el.onclick=()=>openEditor(key,(data[key]).find(i=>i.id==el.dataset.edit)));
  $("#screen").querySelectorAll(".js-del").forEach(el=>el.onclick=e=>{ e.stopPropagation(); confirmDelete(key, el.dataset.id); });
  $("#screen").querySelectorAll(".js-pin").forEach(el=>el.onclick=e=>{ e.stopPropagation(); const x=(data[key]).find(i=>i.id==el.dataset.id); x.pinned=!x.pinned; persist(); });

  // 异步加载心情日记的照片和音频（从 IndexedDB）
  if (m.type === "note") {
    // 照片
    $("#screen").querySelectorAll(".diary-photos[data-photos]").forEach(async el => {
      const ids = JSON.parse(el.dataset.photos || "[]");
      for (const pid of ids) {
        const url = await mediaDB.getURL(pid);
        if (url) {
          const img = document.createElement("img");
          img.src = url;
          img.alt = "";
          img.onclick = () => window.open(url, "_blank");
          el.appendChild(img);
        }
      }
    });
    // 音频
    $("#screen").querySelectorAll(".diary-audio[data-audio]").forEach(async el => {
      const aid = el.dataset.audio;
      const url = await mediaDB.getURL(aid);
      if (url) {
        const audio = document.createElement("audio");
        audio.controls = true;
        audio.src = url;
        el.appendChild(audio);
      }
    });
  }
}

      <div class="frow" id="slot-custom" style="${isCustom?'':'display:none'}">

    fields=renderPortfolioEditor(m, d);

        <option value="buy" ${d.action==='buy'?'selected':''}>买入</option>
        <option value="sell" ${d.action==='sell'?'selected':''}>卖出</option>
        <option value="dividend" ${d.action==='dividend'?'selected':''}>分红</option>

      </select></div>
      <div class="field"><label>数量</label><input id="f-qty" type="number" step="any" value="${d.qty??''}"/></div></div>
      <div class="frow"><div class="field"><label>价格</label><input id="f-price" type="number" step="any" value="${d.price??''}"/></div>
      <div class="field"><label>费用</label><input id="f-fee" type="number" step="any" value="${d.fee??0}"/></div></div>
      <div class="field"><label>日期</label><input id="f-date" type="date" value="${d.date||isoToday()}"/></div>
      <div class="field"><label>备注</label><input id="f-note" value="${attr(d.note||'')}"/></div>`;
  } else {
    fields=`<div class="field"><label>标题</label><input id="f-title" value="${attr(d.title)}" placeholder="给这条起个名"/></div>
      ${(m.moods&&m.moods.length)?`<div class="field"><label>标签 / 心情</label><div class="seg" id="f-mood">${m.moods.map(md=>`<div class="opt ${md===d.mood?'on':''}" data-v="${attr(md)}" style="flex:0 0 auto;min-width:auto">${md}</div>`).join("")}</div></div>`:''}
      <div class="field"><label>内容</label><textarea id="f-content" placeholder="写点什么…" style="min-height:100px">${esc(d.content||'')}</textarea></div>
      <div class="frow">
        <div class="field"><label>日期</label><input id="f-date" type="date" value="${d.date||isoToday()}"/></div>
        <div class="field"><label>地点</label><input id="f-loc" value="${attr(d.loc||'')}" placeholder="例如：上海·外滩"/></div>

  // layout variant selector
  const layoutOpts=[{v:'default',l:'标准'},{v:'feature',l:'大图'},{v:'quote',l:'引文'}];
  fields=`<div class="field"><label>卡片样式</label><div class="seg" id="f-layout">${layoutOpts.map(o=>`<div class="opt ${o.v===(d.layout||'default')?'on':''}" data-v="${o.v}">${o.l}</div>`).join("")}</div></div>`+fields;

    else if(f.type==="number") fields+=`<div class="field"><label>${esc(f.label)}</label><input id="f-cf-${f.key}" type="number" value="${attr(v)}" placeholder="${attr(f.placeholder||'')}"/></div>`;

  const overlay=document.createElement("div"); overlay.className="overlay";

    <div class="modal-actions">${editing?'<button class="link-danger" id="m-del">删除</button>':''}<div class="spacer"></div>
      <button class="btn ghost" id="m-cancel">取消</button><button class="btn" id="m-save">保存</button></div></div>`;
  document.body.appendChild(overlay);
  const close=()=>overlay.remove();
  overlay.onclick=e=>{ if(e.target===overlay) close(); };
  overlay.querySelector("#m-cancel").onclick=close;
  overlay.querySelectorAll(".seg").forEach(seg=>seg.querySelectorAll(".opt").forEach(o=>o.onclick=()=>{
    seg.querySelectorAll(".opt").forEach(x=>x.classList.remove("on")); o.classList.add("on");

      const isCustom=o.dataset.v==="custom";

      if(sc) sc.style.display=isCustom?"":"none";

  }));
  if(editing) overlay.querySelector("#m-del").onclick=()=>{ close(); confirmDelete(key,d.id); };

  // === 阅读关键句：动态添加/删除行 ===
  const quotesBox = overlay.querySelector("#f-quotes");
  const qAddBtn = overlay.querySelector("#q-add");
  if(qAddBtn && quotesBox){
    qAddBtn.onclick=()=>{
      const idx=quotesBox.querySelectorAll(".quote-row").length;
      const row=document.createElement("div");
      row.className="quote-row"; row.dataset.i=idx;
      row.innerHTML=`<input class="q-page" type="number" placeholder="页" style="width:60px"/>
        <input class="q-text" placeholder="摘录的句子"/>
        <button class="q-del" type="button" title="删除">&times;</button>`;
      quotesBox.appendChild(row);
      row.querySelector(".q-del").onclick=()=>row.remove();
    };
    // 已有行的删除按钮
    quotesBox.querySelectorAll(".q-del").forEach(btn=>{
      btn.onclick=e=>{ e.target.closest(".quote-row").remove(); };
    });
  }

  // === 心情日记：照片上传 + 录音 ===
  let editorPhotos = [...(d.photos||[])]; // 存 mediaID 列表
  let editorAudio = d.audio || null;       // 存 mediaID 或 null
  let recRecorder = null, recChunks = [], recTimer = null, recSecs = 0;

  // 照片区
  const photoArea = overlay.querySelector("#photo-area");
  const photoInput = overlay.querySelector("#photo-input");
  function renderPhotoSlots() {
    if(!photoArea) return;
    photoArea.innerHTML = editorPhotos.map((pid,i) =>
      `<div class="ph-slot"><img data-mid="${pid}" src="${editorPhotoURLs[pid]||''}" alt=""><button class="ph-rm" data-i="${i}">&times;</button></div>`
    ).join("") + `<div class="ph-add" id="ph-add">+</div>`;
    photoArea.querySelectorAll(".ph-rm").forEach(b => b.onclick = e => {
      e.stopPropagation();
      const idx = +b.dataset.i;
      mediaDB.del(editorPhotos[idx]);
      editorPhotos.splice(idx, 1);
      renderPhotoSlots();
    });
    const addBtn = photoArea.querySelector("#ph-add");
    if (addBtn) addBtn.onclick = () => photoInput.click();
  }
  const editorPhotoURLs = {};
  // 加载已有照片
  if (editorPhotos.length) {
    Promise.all(editorPhotos.map(async pid => {
      const url = await mediaDB.getURL(pid);
      if (url) { editorPhotoURLs[pid] = url; }
    })).then(renderPhotoSlots);
  } else {
    renderPhotoSlots();
  }
  if(photoInput) photoInput.onchange = async () => {
    if(!photoArea) return;
    for (const file of photoInput.files) {
      const compressed = await compressImage(file);
      const mid = "img_" + Date.now() + "_" + Math.random().toString(36).slice(2,7);
      await mediaDB.put(mid, compressed);
      const url = URL.createObjectURL(compressed);
      editorPhotoURLs[mid] = url;
      editorPhotos.push(mid);
    }
    renderPhotoSlots();
    photoInput.value = "";
  };

  // 录音区
  const recArea = overlay.querySelector("#rec-area");
  let recAudioURL = null;
  function renderRecArea(state) {
    if(!recArea) return;
    // state: 'idle' | 'recording' | 'has'
    if (state === 'idle') {
      recArea.innerHTML = `<button class="rec-btn start" id="rec-start">${icon("mic",18)}</button><span class="rec-hint">点击开始录音</span>`;
      const btn = recArea.querySelector("#rec-start");
      if (btn) btn.onclick = startRec;
    } else if (state === 'recording') {
      recArea.innerHTML = `<button class="rec-btn stop" id="rec-stop">${icon("square",14)}</button><span class="rec-time" id="rec-time">0:00</span><span class="rec-hint">录音中…</span>`;
      const btn = recArea.querySelector("#rec-stop");
      if (btn) btn.onclick = stopRec;
    } else if (state === 'has') {
      recArea.innerHTML = `<button class="rec-btn del" id="rec-del">${icon("trash",14)}</button><audio controls src="${recAudioURL||''}"></audio><span class="rec-hint">录音已就绪</span>`;
      const btn = recArea.querySelector("#rec-del");
      if (btn) btn.onclick = () => {
        if (editorAudio) { mediaDB.del(editorAudio); }
        editorAudio = null; recAudioURL = null;
        renderRecArea('idle');
      };
    }
  }
  async function startRec() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      recRecorder = new MediaRecorder(stream);
      recChunks = [];
      recRecorder.ondataavailable = e => { if (e.data.size > 0) recChunks.push(e.data); };
      recRecorder.onstop = async () => {
        const blob = new Blob(recChunks, { type: recRecorder.mimeType || "audio/webm" });
        const mid = "aud_" + Date.now() + "_" + Math.random().toString(36).slice(2,7);
        await mediaDB.put(mid, blob);
        if (editorAudio) { mediaDB.del(editorAudio); } // 替换旧录音
        editorAudio = mid;
        recAudioURL = URL.createObjectURL(blob);
        renderRecArea('has');
        stream.getTracks().forEach(t => t.stop());
      };
      recRecorder.start();
      recSecs = 0;
      renderRecArea('recording');
      recTimer = setInterval(() => {
        recSecs++;
        const el = recArea.querySelector("#rec-time");
        if (el) el.textContent = `${Math.floor(recSecs/60)}:${pad2(recSecs%60)}`;
      }, 1000);
    } catch (e) {
      recArea.innerHTML = `<span class="rec-hint" style="color:var(--danger)">无法访问麦克风：${esc(e.message)}</span>`;
    }
  }
  function stopRec() {
    if (recRecorder && recRecorder.state === "recording") recRecorder.stop();
    if (recTimer) clearInterval(recTimer);
  }
  // 加载已有录音
  if (editorAudio) {
    mediaDB.getURL(editorAudio).then(url => {
      recAudioURL = url;
      renderRecArea(url ? 'has' : 'idle');
    });
  } else {
    renderRecArea('idle');
  }
  // === end 照片+录音 ===

  overlay.querySelector("#m-save").onclick=()=>{
    const val=id=>{ const el=overlay.querySelector(id); return el?el.value:undefined; };

        // 标签：中文顿号或英文逗号分隔
        const tagsStr=(val("#f-tags")||"").trim();

    }
    else if(m.type==="checkin"){ d.monthGoal=Math.max(0,+val("#f-month-goal")||0); }
    else if(m.type==="finance"){ d.type=seg("#f-ftype")||"expense"; d.amount=Math.max(0,+val("#f-amt")||0); d.category=seg("#f-cat")||(m.categories&&m.categories[0])||"其他"; d.date=val("#f-date"); }

    else if(m.type==="timetable"){

      }
      // 冲突处理：同一星期+同一时段只能有一门课，替换原有课程
      const arr=data[key]||[];

    // save image
    d.image=(val("#f-image")||"").trim();
    if(!editing) (data[key]=data[key]||[]).unshift(d);
    persist(); close();
    // 关闭后若是 portfolio 视图，刷新一次（持仓改动影响总览）
    if(view==="portfolio" && (key==="portfolio"||key==="trades")) renderPortfolio();

  // portfolio 编辑器内的"记一笔交易"按钮绑定
  if(m.type==="portfolio"){
    const tAddBtn = overlay.querySelector("#t-add");
    if(tAddBtn){

        const action = overlay.querySelector("#t-action").value;

        data.trades.push(newTrade);
        let h = (data.portfolio||[]).find(x=>x.code===code);
        if(!h && action==="buy"){
          h = {id:Date.now(), code, name, kind:"stock", qty:0, costPrice:0, buyDate:isoToday(), tags:[]};
          data.portfolio = data.portfolio||[]; data.portfolio.push(h);
        }
        if(h){
          if(action==="buy"){
            const nq=(+h.qty||0)+qty;
            h.costPrice = +(((+h.qty||0)*(+h.costPrice||0) + qty*price)/Math.max(1,nq)).toFixed(4);
            h.qty = nq;

  else if(m.type==="trades") item={...base,code:"",name:"",action:"buy",qty:0,price:0,fee:0,date:isoToday(),note:""};

// 合并模块渲染：顶部 tab 栏 + 子模块内容
function renderGroup(groupKey){
  const m = modOf(groupKey);
  if(!m || !m.subKeys) { renderModule(groupKey); return; }
  const cur = subTab[groupKey] || m.defaultSub || m.subKeys[0];
  // 渲染顶部 tab
  const tabs = m.subKeys.map(sk=>{
    const sm = modOf(sk);
    const active = sk===cur ? "active" : "";
    return `<button class="seg-tab ${active}" data-sub="${sk}">${icon(sm.icon||"circle",14,2)}${sm.name}</button>`;
  }).join("");
  // 子模块入口渲染到屏幕
  const sm = modOf(cur);
  $("#screen").innerHTML = `<div class="header"><div><h2>${m.name}</h2><p>${m.desc}</p></div><div class="spacer"></div></div>
    <div class="sub-tabs b12">${tabs}</div>
    <div id="sub-content"></div>`;
  // 绑定 tab 切换
  $("#screen").querySelectorAll(".seg-tab").forEach(b=>{
    b.onclick = ()=>{
      subTab[groupKey] = b.dataset.sub;
      localStorage.setItem("__subTab", JSON.stringify(subTab));
      renderGroup(groupKey);
    };
  });
  // 渲染子模块内容到 #sub-content
  const oldScreen = $("#screen");
  const subDiv = $("#sub-content");
  // 临时把 screen 替换为 sub-content，让原 renderModule 直接填进去
  // 但 renderModule 直接调 $("#screen").innerHTML=...，所以我们改用 iframe-like 临时替换：
  // 简单做法：在原 renderModule 前后暂时把 screen 替换
  // 用一个标志让 renderModule 写到 sub-content
  window.__renderTarget = subDiv;
  // 临时让 $ 函数返回 subDiv
  const old$ = window.$;
  window.$ = function(sel){ if(sel==="#screen") return subDiv; return old$(sel); };
  try { renderModule(cur); } catch(e){ console.warn("renderGroup", e); }
  window.$ = old$;
  window.__renderTarget = null;
}

/* ============================================================
   PHASE 2 — 投资行情层（TuShare HTTP + 缓存 + 降级）
   ============================================================ */
quotes = {
  cache: {},
  lastFetch: 0,
  fetching: false,

  // ===== 腾讯实时行情（CORS 友好，无需 token） =====
  // 一次拿多个：https://qt.gtimg.cn/q=sh000001,sz399001,sh600519,hk00700,usAAPL
  async qtBatch(qtCodes){
    if(!qtCodes.length) return {};
    const url = "https://qt.gtimg.cn/q=" + qtCodes.join(",");
    const r = await fetch(url, {cache:"no-store"});
    const text = await r.text();
    const map = {};
    const reg = /v_(\w+)="([^"]*)"/g;
    let m;
    while((m = reg.exec(text))){
      const key = m[1];
      const body = m[2];
      if(!body || body.indexOf("~")<0){
        // 可能是 hf_GC 黄金（美元/盎司，需折算元/克）
        if(key.indexOf("hf_")===0){
          const f = body.split(",");
          if(f.length>=8 && +f[0]>0){
            // 1 盎司 = 31.1035 克
            const rate = (CONFIG.invest && CONFIG.invest.goldUsdCny) || 7.0;
            const gPerOz = 31.1035;
            const factor = rate / gPerOz;
            const lastUsd = +f[0];
            const chgUsd = +f[1] || 0;
            const preCloseUsd = +f[7] || lastUsd;
            const last = lastUsd * factor;
            const chg = chgUsd * factor;
            const preClose = preCloseUsd * factor;
            map[key] = {last, open:last, high:(+f[4]||lastUsd)*factor, low:(+f[5]||lastUsd)*factor,
              preClose, chgAmt:chg, chgPct:(preClose?chg/preClose*100:0), vol:0, amount:0,
              name:"黄金(折算)", time:Date.now(), ok:true};
          }
        }
        continue;
      }
      const f = body.split("~");
      if(f.length < 35) continue;
      const last = +f[3];
      if(!(last>0)) continue;  // 未开盘/停牌
      const preClose = +f[4] || last;
      const chg = +f[31] || 0;
      const chgPct = +f[32] || 0;
      map[key] = {
        last, preClose, open:+f[5]||preClose,
        high:+f[33]||last, low:+f[34]||last,
        vol:+f[36]||0, amount:+f[37]||0,
        chgAmt:chg, chgPct,
        name:f[1]||"", time:Date.now(), ok:true
      };
    }
    return map;
  },

  // 内部 code → 腾讯 code（不支持则返回 null）
  toQtCode(code){
    if(/^(000|399)\d{3}\.(SH|SZ)$/.test(code)){  // 沪深指数
      const m = code.match(/^(\d+)\.(SH|SZ)$/);
      return (m[2]==="SH"?"sh":"sz") + m[1];
    }
    if(/^\d{6}\.(SH|SZ)$/.test(code)){  // A股 / ETF / LOF
      const m = code.match(/^(\d+)\.(SH|SZ)$/);
      return (m[2]==="SH"?"sh":"sz") + m[1];
    }
    if(/^\d{4,5}\.HK$/.test(code)){  // 港股个股
      const n = code.match(/^(\d+)\.HK$/)[1];
      return "hk" + n.padStart(5,"0");
    }
    if(code==="HSI") return "hkHSI";        // 恒生指数
    if(code==="HSCEI") return "hkHSCEI";    // 国企指数
    if(code==="HSTECH") return "hkHSTECH";  // 恒生科技
    if(/^[A-Z]+\.(US|NI|SI)$/.test(code)){  // 美股
      return "us" + code.match(/^([A-Z]+)\./)[1];
    }
    if(/^AU\d{3,4}$/i.test(code)){  // 上金所黄金 → 纽约金期货参考
      return "hf_GC";
    }
    return null;
  },

  // ===== 东方财富 基金最新净值（开放式基金） =====
  async fundNav(code){
    const url = `https://api.fund.eastmoney.com/f10/lsjz?fundCode=${code}&pageIndex=1&pageSize=1`;
    const r = await fetch(url, {headers:{Referer:"https://fundf10.eastmoney.com/"}});
    if(!r.ok) return null;
    const j = await r.json();
    const list = j && j.Data && j.Data.LSJZList;
    if(!list || !list.length) return null;
    const row = list[0];
    const last = +row.DWJZ;
    if(!(last>0)) return null;
    return {last, open:last, high:last, low:last, preClose:last,
      chgAmt:0, chgPct:+row.JZZZL||0, vol:0, amount:0,
      name: row.FSRQ||"", time:Date.now(), ok:true};
  },

  // ===== TuShare HTTP API（fallback，需 token + useProxy） =====
  async tsCall(apiName, params={}, fields=""){
    const token = (data.__invest && data.__invest.tushareToken) || CONFIG.invest.tushareToken || "";
    if(!token) throw Object.assign(new Error("NO_TOKEN"), {code:"NO_TOKEN"});
    const useProxy = !!(CONFIG.invest.useProxy || data.__invest?.useProxy);
    if(!useProxy) throw Object.assign(new Error("TS_CORS_DISABLED"), {code:"TS_CORS_DISABLED"});
    const payload = JSON.stringify({api_name:apiName, token, params, fields:fields||undefined});
    const proxyBase = CONFIG.invest.corsProxy || "https://corsproxy.io/?url=";
    const url = proxyBase + encodeURIComponent("https://api.tushare.pro");
    const r = await fetch(url, {method:"POST", headers:{"Content-Type":"application/json"}, body:payload});
    const j = await r.json();
    if(j && j.code===0) return j.data;
    throw new Error("TS_PROXY:"+ (j&&j.code));
  },
  _rowFrom(d){
    if(!d || !d.items || !d.items.length) return null;
    const row = d.items[0], f = d.fields;
    const get = k => { const i = f.indexOf(k); return i>=0 ? row[i] : 0; };
    return this._pack({
      last:+get("close"), open:+get("open"), high:+get("high"), low:+get("low"),
      preClose:+get("pre_close")||0,
      chgAmt:+get("change")||0, chgPct:+get("pct_chg")||0,
      vol:+get("vol")||0, amount:+get("amount")||0
    });
  },
  _pack(o){
    o.time = Date.now();
    o.ok = !isNaN(o.last) && o.last>0;
    return o;
  },

  // 单个 code 取行情：腾讯优先 → 东财基金 → Tushare fallback
  async fetchOne(code){
    if(!code) return null;
    // 开放式基金 6 位数字（无后缀）
    if(/^\d{6}$/.test(code) && !code.match(/^(000|399|51|15|50|56)/)){
      try { const v = await this.fundNav(code); if(v) return v; } catch(e){}
    }
    const qt = this.toQtCode(code);
    if(qt){
      try {
        const m = await this.qtBatch([qt]);
        if(m[qt] && m[qt].ok) return m[qt];
      } catch(e){}
    }
    // Tushare fallback
    try {
      if(/^AU\d{3,4}$/i.test(code)){
        const d = await this.tsCall("sge_daily", {ts_code: code.toUpperCase()},
          "ts_code,trade_date,open,high,low,close,vol,amount,pre_close,change,pct_chg");
        const row = d && d.items && d.items[0];
        if(row){
          const f = d.fields, get = k => row[f.indexOf(k)];
          return this._pack({last:+get("close"), open:+get("open"), high:+get("high"), low:+get("low"),
            preClose:+get("pre_close")||0, chgAmt:+get("change")||0, chgPct:+get("pct_chg")||0,
            vol:+get("vol")||0, amount:+get("amount")||0});
        }
      }
      if(/^(000|399)\d{3}\.(SH|SZ)$/.test(code) || /^(HSI|HSCEI|HSTECH)$/.test(code)){
        const ts = /^(HSI|HSCEI|HSTECH)$/.test(code) ? code+".HK" : code;
        return this._rowFrom(await this.tsCall("index_daily", {ts_code: ts},
          "ts_code,trade_date,open,high,low,close,vol,amount,pct_chg,change,pre_close"));
      }
      if(/^\d{6}\.(SH|SZ)$/.test(code)){
        return this._rowFrom(await this.tsCall("daily", {ts_code: code},
          "ts_code,trade_date,open,high,low,close,vol,amount,pct_chg,change,pre_close"));
      }
    } catch(e){ /* TS_CORS_DISABLED / NO_TOKEN 静默 */ }
    return null;
  },

  // 批量拉取：腾讯支持多 code 一次拿，分组并发
  async refreshAll(){
    if(this.fetching) return;
    this.fetching = true;
    const all = Object.assign({}, data.__quotesCache || {});
    const list = data.portfolio || [];
    const mk = CONFIG.modules.find(m=>m.key==="portfolio")?.marketIndex || [];
    const codes = Array.from(new Set([
      ...list.map(x=>x.code).filter(Boolean),
      ...mk.map(x=>x.code)
    ]));

    // 1) 把能转成腾讯 code 的全部走腾讯批量（一批最多 40 个）
    const qtGroup = [];   // [{qt, origin}]
    const fundCodes = []; // 开放式基金 code
    const others = [];   // TS fallback
    codes.forEach(code=>{
      if(/^\d{6}$/.test(code) && !code.match(/^(000|399|51|15|50|56)/)){
        fundCodes.push(code); return;
      }
      const qt = this.toQtCode(code);
      if(qt) qtGroup.push({qt, origin:code});
      else others.push(code);
    });

    // 腾讯批量
    for(let i=0; i<qtGroup.length; i+=40){
      const slice = qtGroup.slice(i, i+40);
      try {
        const m = await this.qtBatch(slice.map(x=>x.qt));
        slice.forEach(({qt, origin})=>{
          if(m[qt] && m[qt].ok) all[origin] = m[qt];
          else if(!all[origin]) all[origin] = {last:0, ok:false, fail:true, time:Date.now()};
        });
      } catch(e){
        slice.forEach(({origin})=>{ if(!all[origin]) all[origin] = {last:0, ok:false, fail:true, time:Date.now()}; });
      }
    }
    // 基金净值（并发）
    if(fundCodes.length){
      await Promise.all(fundCodes.map(async c=>{
        try { const v = await this.fundNav(c); if(v) all[c]=v; else all[c]={last:0,ok:false,fail:true,time:Date.now()}; }
        catch(e){ all[c]={last:0,ok:false,fail:true,time:Date.now()}; }
      }));
    }

    this.cache = all;
    this.lastFetch = Date.now();
    data.__quotesCache = all;
    store.save();
    this.fetching = false;
  },

  get(code){ return this.cache[code] || (data.__quotesCache && data.__quotesCache[code]) || null; },
  isStale(){ return Date.now() - this.lastFetch > 60*1000; }  // 行情 1 分钟过期
};

/* ============================================================
   PHASE 3 — 持仓编辑器（renderEditor 扩展 + portfolio 编辑表单）
   ============================================================ */
// 持仓计算辅助
function portfolioCalc(holding, quote){
  const q = quote || (quotes && quotes.get && quotes.get(holding.code)) || (data.__quotesCache && data.__quotesCache[holding.code]) || {};
  const last = q.last || holding.costPrice || 0;
  const qty = +holding.qty || 0;
  const cost = +holding.costPrice || 0;
  const marketValue = last * qty;
  const totalCost = cost * qty;
  const pnl = marketValue - totalCost;
  const pnlPct = totalCost>0 ? (pnl/totalCost*100) : 0;
  const dayPct = q.chgPct || 0;
  const dayPnl = (q.preClose||last) ? (last - q.preClose) * qty : 0;
  return {last, qty, cost, marketValue, totalCost, pnl, pnlPct, dayPct, dayPnl, ok:q.ok, fail:q.fail};
}

// 价格预警判断
function priceAlert(holding, quote){
  const c = portfolioCalc(holding, quote);
  if(!c.ok) return "";
  if(holding.targetPrice && c.last >= holding.targetPrice) return "hit-target";
  if(holding.stopLossPrice && c.last <= holding.stopLossPrice) return "hit-stop";
  return "";
}

// 持仓分布饼图 SVG
function pieSVG(data){
  const total = data.reduce((a,b)=>a+b.value,0);
  if(total<=0) return `<div class="pf-empty">无市值数据</div>`;
  const cx=100, cy=100, r=80;
  let acc=0;
  const paths = data.slice(0,8).map((d,i)=>{
    const start = acc/total * 2*Math.PI - Math.PI/2;
    acc += d.value;
    const end = acc/total * 2*Math.PI - Math.PI/2;
    const x1 = cx + r*Math.cos(start), y1 = cy + r*Math.sin(start);
    const x2 = cx + r*Math.cos(end),   y2 = cy + r*Math.sin(end);
    const large = (end-start) > Math.PI ? 1 : 0;
    return `<path d="M ${cx} ${cy} L ${x1.toFixed(2)} ${y1.toFixed(2)} A ${r} ${r} 0 ${large} 1 ${x2.toFixed(2)} ${y2.toFixed(2)} Z" fill="${d.color}" opacity="0.85"/>`;
  }).join("");
  const legend = data.slice(0,8).map(d=>`<div class="lg-row"><span class="lg-dot" style="background:${d.color}"></span><span class="lg-n">${esc(d.name)}</span><span class="lg-p">${(d.value/total*100).toFixed(1)}%</span></div>`).join("");
  return `<div class="pf-pie-wrap"><svg width="200" height="200" viewBox="0 0 200 200">${paths}<circle cx="100" cy="100" r="40" fill="rgba(0,0,0,0.4)"/><text x="100" y="98" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">¥${(total/1000).toFixed(1)}k</text><text x="100" y="115" text-anchor="middle" fill="#aaa" font-size="9">总市值</text></svg>
    <div class="pf-legend">${legend}</div></div>`;
}

// 总资产曲线 SVG
function lineSVG(snaps){
  const w=300, h=120, pad=20;
  const vals = snaps.map(s=>s.totalValue);
  const max = Math.max(...vals, 1), min = Math.min(...vals, 0);
  const range = Math.max(max-min, 1);
  const step = snaps.length>1 ? (w-pad*2)/(snaps.length-1) : 0;
  const pts = snaps.map((s,i)=>({x: pad+i*step, y: h-pad - (s.totalValue-min)/range*(h-pad*2)}));
  const path = pts.map((p,i)=>`${i===0?'M':'L'} ${p.x.toFixed(1)} ${p.y.toFixed(1)}`).join(" ");
  const area = `${path} L ${pts[pts.length-1].x.toFixed(1)} ${h-pad} L ${pts[0].x.toFixed(1)} ${h-pad} Z`;
  const labels = snaps.map((s,i)=>`<text x="${pts[i].x}" y="${h-4}" text-anchor="middle" fill="#888" font-size="9">${s.ym.slice(5)}</text>`).join("");
  const curVal = snaps[snaps.length-1].totalValue.toFixed(0);
  return `<svg width="100%" height="140" viewBox="0 0 ${w} ${h}"><defs><linearGradient id="pf-grad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#5da88e" stop-opacity="0.4"/><stop offset="100%" stop-color="#5da88e" stop-opacity="0"/></linearGradient></defs>
    <path d="${area}" fill="url(#pf-grad)"/>
    <path d="${path}" fill="none" stroke="#5da88e" stroke-width="2"/>
    ${labels}
    <text x="${w-4}" y="14" text-anchor="end" fill="#fff" font-size="11" font-weight="700">¥${curVal}</text></svg>`;
}

function bindPortfolioEditorEvents(m, d, onSave){
  // 记账按钮：生成一条 trade，并同步更新持仓数量与成本
  $("#t-add").onclick = ()=>{
    const action = $("#t-action").value;
    const qty = +$("#t-qty").value || 0;
    const price = +$("#t-price").value || 0;
    const fee = +$("#t-fee").value || 0;
    if(!qty || !price){ toast("请填写数量和价格"); return; }
    // 1) 添加流水
    data.trades = data.trades || [];
    const newTrade = {
      id: Date.now(),
      code: $("#f-code").value.trim(),
      name: $("#f-name").value.trim(),
      action, qty, price, fee,
      date: isoToday(),
      note: action==="buy"?"买入":action==="sell"?"卖出":action==="dividend"?"分红":"费用"
    };
    data.trades.push(newTrade);
    // 2) 同步持仓
    const code = newTrade.code;
    let h = data.portfolio.find(x=>x.code===code);
    if(!h && action==="buy"){
      h = {id:Date.now(), code, name:newTrade.name, kind:"stock", qty:0, costPrice:0, buyDate:isoToday(), tags:[]};
      data.portfolio.push(h);
    }
    if(h){
      if(action==="buy"){
        const newQty = (+h.qty||0) + qty;
        const newCost = ((+h.qty||0)*(+h.costPrice||0) + qty*price) / newQty;
        h.qty = newQty; h.costPrice = +newCost.toFixed(4);
      } else if(action==="sell"){
        h.qty = Math.max(0, (+h.qty||0) - qty);
        // 不改变成本价（卖出后剩余成本基础不变）
      } else if(action==="dividend"){
        // 分红：现金入账，不改变持仓数量
      } else if(action==="fee"){
        // 费用：累加到成本
        const q = +h.qty || 1;
        h.costPrice = +(+h.costPrice + fee/q).toFixed(4);
      }
    }
    store.save();
    toast(`已记录${action==="buy"?"买入":action==="sell"?"卖出":action==="dividend"?"分红":"费用"} ${qty} @ ¥${price}`);
    // 同步表单显示
    $("#f-qty").value = h ? h.qty : qty;
    $("#f-cost").value = h ? h.costPrice : price;
  };
}

// 月底自动写入资产快照
function maybeSnapshotAsset(){
  const ym = curYM();
  const snaps = data.__assetSnapshots = data.__assetSnapshots || [];
  // 当月已写入则跳过
  if(snaps.find(s=>s.ym===ym)) return;
  // 月份结束当天或之前写入（这里简化为：每次访问洞察页时如果当月还没写且不是1号则补写）
  const holdings = data.portfolio || [];
  const totalValue = holdings.reduce((a,h)=>a + portfolioCalc(h).marketValue, 0);
  const totalCost = holdings.reduce((a,h)=>a + portfolioCalc(h).totalCost, 0);
  const money = data.money || [];
  const inc = money.filter(x=>x.type==="income").reduce((a,x)=>a+ +x.amount,0);
  const exp = money.filter(x=>x.type==="expense").reduce((a,x)=>a+ +x.amount,0);
  snaps.push({ym, totalValue: +totalValue.toFixed(2), totalCost: +totalCost.toFixed(2), cash: +(inc-exp).toFixed(2)});
  // 仅保留最近 24 个月
  if(snaps.length>24) snaps.splice(0, snaps.length-24);
  store.save();
}

// 投资复盘卡片（嵌入 renderInsight）
function investmentReviewHTML(){
  const holdings = data.portfolio || [];
  if(!holdings.length) return "";
  let totalCost=0, totalValue=0;
  const byKind = {}; // 按类型分组
  holdings.forEach(h=>{
    const c = portfolioCalc(h);
    totalCost += c.totalCost;
    totalValue += c.marketValue;
    const k = h.kind || "stock";
    if(!byKind[k]) byKind[k] = {cost:0, value:0, count:0, monthGoal:0, hit:0};
    byKind[k].cost += c.totalCost;
    byKind[k].value += c.marketValue;
    byKind[k].count++;
    byKind[k].monthGoal += (+h.monthGoal||0);
    if(h.monthGoal && c.pnlPct >= h.monthGoal) byKind[k].hit++;
  });
  const totalPct = totalCost>0 ? (totalValue-totalCost)/totalCost*100 : 0;
  const cls = totalPct>=0 ? "done" : "warn";
  // 月目标完成度
  const rows = Object.entries(byKind).map(([k,v])=>{
    const pct = v.monthGoal ? Math.min(100, Math.round((totalPct/v.monthGoal)*100)) : 0;
    const rowCls = pct>=100 ? "done" : (pct>=60?"ok":"warn");
    return `<div class="rv-row ${rowCls}">
      <div class="rv-name">${{stock:"股票",fund:"基金",gold:"黄金",index:"指数",bond:"债券"}[k]||k} · ${v.count}项</div>
      <div class="rv-bar"><i style="width:${pct}%"></i></div>
      <div class="rv-val">${totalPct>=0?'+':''}${totalPct.toFixed(1)}%<span class="rv-g">/${v.monthGoal||0}%</span></div>
      <div class="rv-pct ${rowCls}">${pct}%</div>
    </div>`;
  }).join("");

  // 净资产聚合：现金 + 投资 + 黄金
  const money = data.money || [];
  const cash = money.filter(x=>x.type==="income").reduce((a,x)=>a+ +x.amount,0)
    - money.filter(x=>x.type==="expense").reduce((a,x)=>a+ +x.amount,0);
  const goldValue = (byKind.gold?.value) || 0;
  const netWorth = cash + totalValue;
  const cashPct = netWorth>0 ? (cash/netWorth*100) : 0;
  const investPct = netWorth>0 ? ((totalValue-goldValue)/netWorth*100) : 0;
  const goldPct = netWorth>0 ? (goldValue/netWorth*100) : 0;

  return `
    <div class="rv-card rv-invest-overview">
      <div class="rv-hd">${icon("wallet",15)} 净资产总览</div>
      <div class="rv-net-worth">
        <div class="rv-nw-val">¥${netWorth.toFixed(2)}</div>
        <div class="rv-nw-bar">
          <i style="width:${cashPct}%;background:var(--module-4)"></i>
          <i style="width:${investPct}%;background:var(--module-6)"></i>
          <i style="width:${goldPct}%;background:#e6b877"></i>
        </div>
        <div class="rv-nw-leg">
          <span><i style="background:var(--module-4)"></i> 现金 ¥${cash.toFixed(0)} (${cashPct.toFixed(1)}%)</span>
          <span><i style="background:var(--module-6)"></i> 投资 ¥${(totalValue-goldValue).toFixed(0)} (${investPct.toFixed(1)}%)</span>
          <span><i style="background:#e6b877"></i> 黄金 ¥${goldValue.toFixed(0)} (${goldPct.toFixed(1)}%)</span>
        </div>
      </div>
    </div>
    <div class="rv-card">
      <div class="rv-hd">${icon("trending",15)} 投资表现 · ${curYM()}</div>
      <div class="rv-row ${cls}">
        <div class="rv-name">综合收益率</div>
        <div class="rv-bar"><i style="width:${Math.min(100, Math.abs(totalPct))}%"></i></div>
        <div class="rv-val">¥${(totalValue-totalCost).toFixed(0)}<span class="rv-g">/¥${totalCost.toFixed(0)}</span></div>
        <div class="rv-pct ${cls}">${totalPct>=0?'+':''}${totalPct.toFixed(2)}%</div>
      </div>
      ${rows}
    </div>`;
}

/* ============================================================
   PHASE 7 — 工具：toast + showModal/closeModal
   ============================================================ */
function toast(msg){
  let t = document.getElementById("toast-el");
  if(!t){
    t = document.createElement("div");
    t.id = "toast-el"; t.className = "toast";
    document.body.appendChild(t);
  }
  t.textContent = msg; t.classList.add("show");
  clearTimeout(t._timer);
  t._timer = setTimeout(()=>t.classList.remove("show"), 2400);
}

function showModal(html){
  let m = document.getElementById("modal-root");
  if(!m){ m = document.createElement("div"); m.id="modal-root"; m.className="modal-root"; document.body.appendChild(m); }
  m.innerHTML = `<div class="modal-card">${html}</div>`;
  m.classList.add("show");
}
function closeModal(){
  const m = document.getElementById("modal-root");
  if(m){ m.classList.remove("show"); m.innerHTML=""; }
}

.pf-empty-mini{color:var(--text-tertiary);font-size:12px;padding:24px 8px;text-align:center}

/* 持仓编辑器 */
.pf-trade-section{margin-top:14px;padding-top:14px;border-top:1px dashed var(--border)}
.pf-trade-h{font-weight:600;font-size:13px;color:var(--text-secondary);margin-bottom:8px}

/* 洞察页净资产 */
.rv-invest-overview .rv-net-worth{padding:14px 16px}
.rv-nw-val{font-size:24px;font-weight:700;margin-bottom:10px}
.rv-nw-bar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--surface-nested);margin-bottom:8px}
.rv-nw-bar i{display:block;height:100%}
.rv-nw-leg{display:flex;flex-wrap:wrap;gap:12px;font-size:11px;color:var(--text-secondary)}
.rv-nw-leg span{display:flex;align-items:center;gap:4px}
.rv-nw-leg i{display:inline-block;width:10px;height:10px;border-radius:2px}

/* Modal + Toast */
.modal-root{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:9999}
.modal-root.show{display:flex}
.modal-card{background:var(--surface-card);border:1px solid var(--border);border-radius:14px;width:90%;max-width:480px;max-height:85vh;overflow:auto}
.modal-h{padding:14px 18px;border-bottom:1px solid var(--border);font-weight:700;font-size:15px}
.modal-body{padding:16px 18px}
.modal-body .field{margin-bottom:10px}
.modal-body .field label{display:block;font-size:12px;color:var(--text-secondary);margin-bottom:4px;font-weight:600}
.modal-body input,.modal-body select,.modal-body textarea{width:100%;padding:8px 10px;border-radius:8px;background:var(--surface-nested);border:1px solid var(--border);color:var(--text-primary);font-size:13px}
.modal-body .field-row{display:flex;gap:10px}
.modal-body .field-row .field{flex:1}
.modal-tip{font-size:11px;color:var(--text-tertiary);margin-top:8px}
.modal-tip a{color:var(--module-6)}
.modal-foot{padding:12px 18px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(20px);background:rgba(0,0,0,.85);color:#fff;padding:10px 18px;border-radius:24px;font-size:13px;z-index:10000;opacity:0;transition:all .25s}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.btn.sm{padding:4px 10px;font-size:11px}

document.head.appendChild(Object.assign(document.createElement('style'),{textContent:PORTFOLIO_CSS}));

/* ============================================================
   PWA — 注册 Service Worker（生产环境 + localhost 启用）
   ============================================================ */
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js")
      .then(reg => console.log("[PWA] SW 注册成功:", reg.scope))
      .catch(err => console.warn("[PWA] SW 注册失败:", err));
  });
}
