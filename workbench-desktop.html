<style>
  /* ============================================================
     THEME TOKENS — 一处改色，整站换肤（简约·墨色中性默认）
     ============================================================ */
  :root {
    /* ---- 页面与表面（米白旧报纸） ---- */
    --page-bg: #f1e8d3;              /* 页面底色·泛黄旧报纸 */
    --surface-card: #fbf5e6;         /* 卡片/面板/输入框·稍亮的纸 */
    --surface-nested: #ece0c2;       /* 嵌套区域·更深的纸纹 */

    /* ---- 边框（纸边褐） ---- */
    --border: #d9caa3;               /* 常规边框：卡片、分隔线 */
    --border-input: #c4b07e;         /* 强边框：输入框、按钮、chip、勾选框 */

    /* ---- 文本层级（浅棕文字） ---- */
    --text: #3a2f1f;                 /* 主文本：深棕墨字 */
    --text-secondary: #8a7550;       /* 次文本：中棕 */
    --text-tertiary: #b8a67c;        /* 弱文本：浅棕 */

    /* ---- 主色（橘黄） ---- */
    --accent: #c46a2a;               /* 主色·橘黄：按钮、选中、竖条 */
    --accent-muted: #f0dcc0;         /* 主色浅底：focus 光晕 */
    --on-accent: #fbf5e6;            /* 主色上的前景文字 */

    /* ---- 模块色（橘黄 + 墨绿 + 赭黄 + 砖红 + 灰紫） ---- */
    --module-1: #c46a2a;             /* 橘黄 — 打卡/完成/收入 */
    --module-2: #3d6b4f;             /* 墨绿 — 阅读/趋势线 */
    --module-3: #b58a2e;             /* 赭黄 — 运动/星标 */
    --module-4: #a65d3e;             /* 砖红 — 记账/占比 */
    --module-5: #6b5b8a;             /* 灰紫 — 笔记/日记 */

    /* ---- 危险色 ---- */
    --danger: #a63d2a;               /* 删除/危险 */
    --danger-muted: #f0ddd4;         /* 危险浅底 */

    /* ---- 抽屉/侧栏（深棕编辑部） ---- */
    --drawer-bg: #2b2215;            /* 侧栏底色·深棕 */
    --drawer-bg-top: #3d3220;        /* 侧栏渐变上色 */
    --drawer-text: #f1e8d3;          /* 侧栏前景·米白 */
    --drawer-text-mute: rgba(241,232,211,.55);
    --drawer-hover: rgba(241,232,211,.08);
    --drawer-active: rgba(241,232,211,.14);

    /* ---- 背景图 ---- */
    --greet-image: url("assets/greet-banner.jpg");
    --page-texture: none;

    /* ---- 圆角 ---- */
    --radius-control: 6px;
    --radius-tile: 10px;
    --radius-card: 14px;
    --radius-sheet: 18px;

    /* ---- 阴影（报纸油墨感） ---- */
    --shadow-card: 0 1px 2px rgba(58,47,31,.05), 0 6px 18px rgba(58,47,31,.07);
    --shadow-overlay: 0 14px 36px rgba(58,47,31,.18);

    /* ---- 字体与布局 ---- */
    --font: "Noto Serif SC", "Source Han Serif SC", "Songti SC", "SimSun", Georgia, serif;
    --font-hand: "Zhi Mang Xing", "Caveat", "Kaiti", cursive;
    --sidebar-w: 258px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--page-bg); color: var(--text); font-family: var(--font); font-size: 14px; line-height: 1.5;
    -webkit-font-smoothing: antialiased; min-height: 100vh; min-width: 1000px;
  }
  body::before { content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
    background-image: var(--page-texture); background-size: cover; background-position: center; opacity:.5; }
  /* 纸张纤维纹理：多层径向渐变模拟旧报纸的纸纹 */
  body::after { content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
    background-image:
      radial-gradient(circle at 20% 30%, rgba(180,150,90,.05) 0, transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(160,120,60,.04) 0, transparent 45%),
      repeating-linear-gradient(0deg, rgba(120,90,50,.018) 0 1px, transparent 1px 3px),
      repeating-linear-gradient(90deg, rgba(120,90,50,.012) 0 1px, transparent 1px 4px);
    mix-blend-mode: multiply; }
  svg { display: block; }
  .layout { min-height: 100vh; }

  /* ============================================================
     复古报刊编辑部 · 装饰元素（邮票 / 胶带 / 铅笔批注 / 报头 / 小猫涂鸦）
     ============================================================ */
  /* 手写字体工具类 */
  .hand { font-family: var(--font-hand); font-weight: normal; }

  /* 报头（masthead）—— 报纸式大标题 */
  .masthead { text-align:center; padding: 18px 0 6px; border-bottom: 3px double var(--text); position:relative; margin-bottom: 4px; }
  .masthead .m-title { font-family: var(--font); font-weight:900; font-size: 40px; letter-spacing: .08em; color:var(--text); line-height:1; }
  .masthead .m-sub { font-size: 12px; letter-spacing: .35em; color:var(--text-secondary); margin-top: 6px; text-transform: uppercase; }
  .masthead .m-meta { display:flex; justify-content:space-between; align-items:center; font-size:11px; color:var(--text-secondary);
    margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--border); }
  .masthead .m-meta .price { color:var(--accent); font-weight:700; }

  /* 报纸分栏竖线（双细线） */
  .col-rule { border-left: 1px solid var(--border); border-right: 1px solid var(--border); }

  /* 邮票（邮票）：齿孔边框 + 旋转 */
  .stamp { display:inline-flex; align-items:center; gap:6px; padding: 6px 14px; position:relative;
    background: var(--surface-nested); color: var(--accent); font-weight:700; font-size: 12.5px; letter-spacing:.04em;
    border: 1.5px solid var(--accent); transform: rotate(-4deg); box-shadow: 1px 2px 0 rgba(58,47,31,.08); }
  .stamp::before { content:""; position:absolute; inset:0; pointer-events:none;
    -webkit-mask: radial-gradient(circle, transparent 0 2.5px, #000 2.8px) 0 0/7px 7px;
            mask: radial-gradient(circle, transparent 0 2.5px, #000 2.8px) 0 0/7px 7px;
    background: var(--accent); opacity:.12; }
  .stamp.s-green { color:var(--module-2); border-color:var(--module-2); }
  .stamp.s-green::before { background: var(--module-2); }
  .stamp.s-brown { color:var(--module-4); border-color:var(--module-4); }
  .stamp.s-brown::before { background: var(--module-4); }

  /* 胶带（胶带）：半透明斜贴条 */
  .tape { position:absolute; width: 78px; height: 22px; background: rgba(245,220,140,.55);
    box-shadow: 0 1px 2px rgba(58,47,31,.12); pointer-events:none; z-index: 2; }
  .tape.tl { top:-9px; left: 18px; transform: rotate(-8deg); }
  .tape.tr { top:-9px; right: 18px; transform: rotate(7deg); }
  .tape.bl { bottom:-9px; left: 22px; transform: rotate(6deg); }
  .tape.br { bottom:-9px; right: 22px; transform: rotate(-7deg); }
  .tape.green { background: rgba(120,170,130,.45); }
  .tape.orange { background: rgba(230,150,80,.5); }

  /* 铅笔批注：手写小字，略带旋转，铅笔灰绿色 */
  .pencil-note { font-family: var(--font-hand); font-size: 14px; color: #5a7a52; line-height: 1.3;
    transform: rotate(-3deg); letter-spacing: .02em; }
  .pencil-note.orange { color: #b56a2a; }
  .pencil-note.brown  { color: #7a5a3a; }
  .pencil-note.right  { transform: rotate(3deg); text-align: right; }

  /* 圈注（红笔圈） */
  .red-circle { display:inline-block; border: 2px solid var(--danger); border-radius: 50%;
    padding: 0 6px; line-height: 1.4; transform: rotate(-2deg); }

  /* 小猫涂鸦 SVG 容器 */
  .cat-doodle { display:inline-block; vertical-align: middle; color: var(--text-secondary); opacity:.7; }
  .cat-doodle.big { width: 64px; height: 64px; }

  /* 报头下方分割装饰（带小猫） */
  .news-divider { display:flex; align-items:center; gap:10px; margin: 18px 0 10px; }
  .news-divider .line { flex:1; height:0; border-top: 2px solid var(--text); position:relative; }
  .news-divider .line::after { content:""; position:absolute; inset:0; border-top: 1px solid var(--text); transform: translateY(3px); opacity:.5; }
  .news-divider .kicker { font-size: 11px; letter-spacing:.3em; color:var(--text-secondary); text-transform: uppercase; }

  /* 报角小标记 */
  .edition-tag { display:inline-block; font-size:10px; letter-spacing:.2em; color:var(--accent);
    border:1px solid var(--accent); padding:2px 8px; transform:rotate(-2deg); }

  /* ============================================================
     心情日记：照片画廊 + 音频播放器 + 地点
     ============================================================ */
  .diary-photos { display:flex; flex-wrap:wrap; gap:6px; margin:8px 0; }
  .diary-photos img { width:72px; height:72px; object-fit:cover; border-radius:6px;
    border:2px solid var(--surface-nested); cursor:pointer; transition:transform .15s; }
  .diary-photos img:hover { transform:scale(1.05); border-color:var(--accent); }
  .diary-audio { display:flex; align-items:center; gap:8px; margin:6px 0; padding:8px 12px;
    background:var(--surface-nested); border-radius:var(--radius-tile); border:1px solid var(--border-input); }
  .diary-audio audio { height:32px; max-width:240px; }
  .diary-audio .a-label { font-size:12px; color:var(--text-secondary); white-space:nowrap; }
  .diary-loc { display:inline-flex; align-items:center; gap:4px; font-size:12px; color:var(--text-secondary);
    margin:4px 0; }
  .diary-loc svg { opacity:.6; }

  /* 编辑器内：照片上传区 */
  .photo-upload { display:flex; flex-wrap:wrap; gap:8px; margin-top:6px; }
  .photo-upload .ph-slot { position:relative; width:80px; height:80px; border-radius:8px;
    border:2px dashed var(--border-input); overflow:hidden; background:var(--surface-nested); }
  .photo-upload .ph-slot img { width:100%; height:100%; object-fit:cover; }
  .photo-upload .ph-slot .ph-rm { position:absolute; top:2px; right:2px; width:18px; height:18px;
    background:rgba(0,0,0,.6); color:#fff; border-radius:50%; font-size:12px; line-height:18px;
    text-align:center; cursor:pointer; border:none; padding:0; }
  .photo-upload .ph-add { width:80px; height:80px; border-radius:8px; border:2px dashed var(--border-input);
    display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--text-tertiary);
    background:var(--surface-nested); font-size:24px; }
  .photo-upload .ph-add:hover { border-color:var(--accent); color:var(--accent); }

  /* 编辑器内：录音区 */
  .rec-area { display:flex; align-items:center; gap:8px; margin-top:6px; padding:10px 12px;
    background:var(--surface-nested); border-radius:var(--radius-tile); border:1px solid var(--border-input); }
  .rec-area .rec-btn { width:36px; height:36px; border-radius:50%; border:none; font-size:16px;
    cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all .15s; }
  .rec-area .rec-btn.start { background:var(--danger); color:#fff; }
  .rec-area .rec-btn.stop { background:var(--module-2); color:#fff; animation:pulse 1s infinite; }
  .rec-area .rec-btn.play { background:var(--accent); color:#fff; }
  .rec-area .rec-btn.del { background:var(--surface-card); color:var(--danger); border:1px solid var(--border-input); }
  .rec-area .rec-time { font-size:13px; color:var(--text-secondary); min-width:40px; }
  .rec-area audio { height:32px; max-width:200px; }
  .rec-area .rec-hint { font-size:12px; color:var(--text-tertiary); }

  /* ============================================================
     云同步：登录弹窗 + 同步状态指示器
     ============================================================ */
  .sync-indicator { display:flex; align-items:center; gap:6px; font-size:11px; padding:4px 0; }
  .sync-dot { width:7px; height:7px; border-radius:50%; flex:0 0 auto; }
  .sync-dot.offline { background:var(--text-tertiary); }
  .sync-dot.syncing { background:var(--module-3); animation:pulse 1s infinite; }
  .sync-dot.synced  { background:var(--module-2); }
  .sync-dot.error   { background:var(--danger); }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

  .auth-btn { display:block; width:100%; text-align:center; font-size:12px; padding:8px 12px;
    border:1px solid var(--drawer-hover); border-radius:var(--radius-tile); color:var(--drawer-text);
    background:transparent; cursor:pointer; margin-top:8px; transition:background .15s; }
  .auth-btn:hover { background:var(--drawer-hover); }

  /* 媒体备份按钮 */
  .backup-row { display:flex; gap:6px; margin-top:6px; }
  .backup-btn { flex:1; text-align:center; font-size:11px; padding:6px 8px;
    border:1px solid var(--drawer-hover); border-radius:var(--radius-tile); color:var(--drawer-text);
    background:transparent; cursor:pointer; transition:background .15s; }
  .backup-btn:hover { background:var(--drawer-hover); }
  .backup-btn:disabled { opacity:.5; cursor:wait; }

  /* 登录弹窗 */
  .login-overlay { position:fixed; inset:0; background:rgba(58,47,31,.5); backdrop-filter:blur(4px);
    z-index:100; display:none; align-items:center; justify-content:center; }
  .login-overlay.show { display:flex; }
  .login-card { background:var(--surface-card); border:1px solid var(--border-input); border-radius:var(--radius-sheet);
    box-shadow:var(--shadow-overlay); padding:32px 30px; width:360px; max-width:90vw; position:relative; }
  .login-card .tape { background:rgba(230,150,80,.5); }
  .login-card h2 { font-size:22px; font-weight:900; color:var(--text); text-align:center; margin-bottom:4px; }
  .login-card .sub { font-size:12px; color:var(--text-secondary); text-align:center; margin-bottom:20px; letter-spacing:.05em; }
  .login-card .field { margin-bottom:14px; }
  .login-card .field label { display:block; font-size:12px; color:var(--text-secondary); margin-bottom:4px; }
  .login-card .field input { width:100%; border:1px solid var(--border-input); border-radius:var(--radius-tile);
    padding:10px 12px; font-size:14px; color:var(--text); background:var(--surface-nested); box-sizing:border-box; }
  .login-card .field input:focus { outline:none; border-color:var(--accent); }
  .login-card .btn-row { display:flex; gap:10px; margin-top:6px; }
  .login-card .btn { flex:1; padding:11px; border-radius:var(--radius-tile); font-size:14px; font-weight:600;
    cursor:pointer; border:1px solid var(--border-input); }
  .login-card .btn-primary { background:var(--accent); color:var(--on-accent); border-color:var(--accent); }
  .login-card .btn-secondary { background:var(--surface-nested); color:var(--text); }
  .login-card .btn:hover { opacity:.85; }
  .login-card .err { color:var(--danger); font-size:12px; text-align:center; margin-top:10px; min-height:16px; }
  .login-card .close-x { position:absolute; top:10px; right:14px; font-size:20px; color:var(--text-tertiary);
    cursor:pointer; background:none; border:none; }
  .login-card .close-x:hover { color:var(--text); }



  /* ---------- sidebar (固定在左侧，不随内容滚动) ---------- */
  .sidebar { background: linear-gradient(180deg, var(--drawer-bg-top), var(--drawer-bg)); color: var(--drawer-text);
    display: flex; flex-direction: column; position: fixed; top: 0; left: 0; width: var(--sidebar-w); height: 100vh; z-index: 30; }
  .sidebar .brand { padding: 24px 20px 18px; display: flex; align-items: center; gap: 13px; }
  .sidebar .brand .ava { position: relative; width: 46px; height: 46px; border-radius: 13px; overflow: hidden; flex: 0 0 auto;
    background: var(--drawer-hover); box-shadow: 0 0 0 1px var(--drawer-active); cursor: pointer; }
  .sidebar .brand .ava img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .sidebar .brand .ava .cam { position: absolute; inset: 0; display: grid; place-items: center; opacity: 0;
    background: rgba(35,34,32,.5); color: var(--drawer-text); transition: opacity .15s; }
  .sidebar .brand .ava:hover .cam { opacity: 1; }
  .sidebar .brand h1 { font-size: 17px; font-weight: 800; letter-spacing: -.01em; }
  .sidebar .brand p { font-size: 11px; opacity: .5; margin-top: 3px; letter-spacing: .05em; }
  .sidebar .nav { flex: 1; overflow-y: auto; padding: 6px 12px 12px; }
  .sidebar .nav::-webkit-scrollbar { width: 6px; }
  .sidebar .nav::-webkit-scrollbar-thumb { background: var(--drawer-text-mute); border-radius: 6px; }
  .navi { display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-radius: 11px; cursor: pointer;
    font-size: 14px; font-weight: 500; color: color-mix(in srgb, var(--drawer-text) 82%, transparent); transition: background .15s; margin-bottom: 2px; }
  .navi:hover { background: var(--drawer-hover); }
  .navi.active { background: var(--drawer-active); color: var(--drawer-text); font-weight: 700; }
  .navi svg { color: var(--drawer-text-mute); flex: 0 0 auto; }
  .navi.active svg { color: var(--drawer-text); }
  .nav-sep { font-size: 10.5px; opacity: .42; padding: 15px 14px 6px; letter-spacing: .1em; }
  .sidebar .foot { padding: 15px 20px; font-size: 11px; opacity: .42; border-top: 1px solid var(--drawer-hover); }

  /* ---------- main ---------- */
  .main { margin-left: var(--sidebar-w); padding: 26px 34px 48px; }
  .main > #screen { max-width: 1180px; }
  .header { display: flex; align-items: flex-end; gap: 16px; margin-bottom: 6px; }
  .header h2 { font-size: 27px; font-weight: 800; letter-spacing: -.03em; }
  .header p { color: var(--text-secondary); font-size: 13px; margin-top: 5px; }
  .header .spacer { flex: 1; }
  .date-chip { display:inline-flex; align-items:center; gap:6px; font-size:13px; color:var(--text-secondary);
    background: var(--surface-card); border:1px solid var(--border); border-radius:999px; padding:8px 15px; box-shadow: var(--shadow-card); }
  .date-chip svg { color: var(--text-tertiary); }

  /* ---------- hero banner (顶部大图问候区) ---------- */
  .hero-banner { position: relative; overflow: hidden; border-radius: var(--radius-sheet); border: 1px solid var(--border);
    box-shadow: var(--shadow-card); min-height: 208px; display: flex; flex-direction: column; justify-content: center;
    padding: 34px 40px; margin-bottom: 24px;
    background: var(--surface-nested) var(--greet-image) right center / cover no-repeat; }
  .hero-banner::before { content:""; position:absolute; inset:0; pointer-events:none;
    background: linear-gradient(100deg, var(--surface-card) 34%, color-mix(in srgb, var(--surface-card) 82%, transparent) 52%, transparent 76%); }
  .hero-banner > * { position: relative; z-index: 1; }
  .hero-banner .hi { font-size: 34px; font-weight: 800; letter-spacing: -.03em; }
  .hero-banner .sub { color: var(--text-secondary); font-size: 14px; margin-top: 7px; max-width: 460px; }
  .hero-banner .hstats { display: flex; gap: 26px; margin-top: 22px; }
  .hero-banner .hstat { display: flex; flex-direction: column; gap: 2px; }
  .hero-banner .hstat .n { font-size: 22px; font-weight: 800; letter-spacing: -.02em; }
  .hero-banner .hstat .t { font-size: 12px; color: var(--text-secondary); }
  .hero-banner .hstat + .hstat { padding-left: 26px; border-left: 1px solid var(--border-input); }
  .hero-banner .htop { position: absolute; top: 22px; right: 26px; z-index: 2; display: flex; gap: 10px; align-items: center; }

  .card { background: var(--surface-card); border: 1px solid var(--border); border-radius: var(--radius-card); box-shadow: var(--shadow-card); }
  .sec-title { display:flex; align-items:center; gap:9px; font-size:14px; font-weight:800; margin: 18px 2px 10px; letter-spacing: -.01em; }
  .sec-title::before { content:""; width: 3px; height: 14px; border-radius: 2px; background: var(--accent); }

  /* ---------- dashboard grid ---------- */
  .grid { display: grid; gap: 16px; }
  .g-4 { grid-template-columns: repeat(4, 1fr); }
  .g-3 { grid-template-columns: repeat(3, 1fr); }
  .g-2 { grid-template-columns: repeat(2, 1fr); }
  .g-main { grid-template-columns: 1.55fr 1fr; align-items: start; }

  /* 各模块概况卡片 */
  .modcard-grid { display:grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .modcard { background: var(--surface-card); border: 1px solid var(--border); border-radius: var(--radius-card); box-shadow: var(--shadow-card);
    padding: 15px 16px; cursor: pointer; transition: transform .12s, box-shadow .18s, border-color .15s; }
  .modcard:hover { transform: translateY(-2px); box-shadow: var(--shadow-overlay); border-color: var(--border-input); }
  .modcard .mc-head { display:flex; align-items:center; gap: 11px; }
  .modcard .mc-ic { width: 36px; height: 36px; border-radius: 10px; display:grid; place-items:center; flex:0 0 auto; }
  .modcard .mc-tt { flex:1; min-width:0; }
  .modcard .mc-name { font-size: 14.5px; font-weight: 800; letter-spacing: -.01em; }
  .modcard .mc-desc { font-size: 11.5px; color: var(--text-secondary); margin-top: 1px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .modcard .mc-arw { color: var(--text-tertiary); flex:0 0 auto; }
  .modcard .mc-body { display:flex; align-items:baseline; gap: 8px; margin-top: 11px; }
  .modcard .mc-main { font-size: 15px; font-weight: 800; letter-spacing: -.01em; }
  .modcard .mc-extra { font-size: 12px; color: var(--text-secondary); }

  /* quote banner */
  .quote { padding: 22px 26px; border-radius: var(--radius-card); position: relative; overflow: hidden;
    background: var(--surface-card); border: 1px solid var(--border); box-shadow: var(--shadow-card); }
  .quote::before { content:""; position:absolute; left:0; top:18px; bottom:18px; width:3px; border-radius:2px; background: var(--accent); }
  .quote .tag { display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:700; color:var(--text-secondary);
    letter-spacing:.04em; margin-bottom:11px; }
  .quote .tag svg { color: var(--text-tertiary); }
  .quote .txt { font-size:20px; font-weight:700; color:var(--text); letter-spacing:-.01em; line-height:1.5; }

  /* overview rings */
  .rings { display:grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap:0; }
  .ring { display:flex; flex-direction:column; align-items:center; gap:8px; padding:12px 4px; cursor:pointer; min-width:0;
    border-radius: var(--radius-card); transition: background .15s; }
  .ring:hover { background: var(--surface-nested); }
  .ring .dial { position:relative; width:100%; max-width:128px; aspect-ratio:1; }
  .ring .dial svg.gauge { transform: rotate(-90deg); width:100%; height:100%; }
  .ring .dial .mid { position:absolute; inset:0; display:grid; place-items:center; }
  .ring .pct { font-size:18px; font-weight:800; letter-spacing:-.02em; }
  .ring .lbl { font-size:14.5px; font-weight:700; }
  .ring .sub { font-size:12px; color:var(--text-secondary); }

  /* quick add */
  .quick-grid { display:grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap:10px; }
  .qbtn { display:flex; align-items:center; gap:12px; padding:14px 15px; border:none; cursor:pointer; border-radius:var(--radius-tile);
    background:var(--surface-card); border:1px solid var(--border); box-shadow: var(--shadow-card); text-align:left; transition: all .15s; min-width:0; }
  .qbtn:hover { border-color:var(--border-input); transform: translateY(-1px); box-shadow: var(--shadow-overlay); }
  .qbtn .e { position:relative; width:42px; height:42px; border-radius:12px; display:grid; place-items:center; flex:0 0 auto; }
  .qbtn .e .qplus { position:absolute; right:-3px; bottom:-3px; width:17px; height:17px; border-radius:50%;
    background: var(--accent); color:var(--on-accent); display:grid; place-items:center; border: 2px solid var(--surface-card); }
  .qbtn .l { font-size:13.5px; font-weight:700; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  /* trend panel */
  .panel { background: var(--surface-card); border: 1px solid var(--border); border-radius: var(--radius-card); box-shadow: var(--shadow-card); padding:18px; }
  .panel .ph { display:flex; align-items:center; gap:8px; font-size:14px; font-weight:800; }
  .panel .ph svg { color: var(--text-tertiary); }
  .panel .ph .avg { margin-left:auto; font-size:12px; color:var(--text-secondary); font-weight:500; }
  .trend-svg { width:100%; height:auto; margin-top:14px; display:block; }
  .trend-x { display:flex; justify-content:space-between; font-size:11px; color:var(--text-secondary); margin-top:4px; padding:0 6px; }
  .trend-empty { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; height: 168px;
    color: var(--text-tertiary); font-size: 13px; margin-top: 8px; }

  /* ---------- pinned tasks ---------- */
  .pin-list { display:grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .pin { display:flex; align-items:center; gap: 13px; padding: 15px 16px; border-radius: var(--radius-tile);
    background: var(--surface-card); border: 1px solid var(--border); box-shadow: var(--shadow-card); transition: box-shadow .15s, transform .12s; }
  .pin:hover { box-shadow: var(--shadow-overlay); transform: translateY(-1px); }
  .pin-ic { width: 38px; height: 38px; border-radius: 11px; display:grid; place-items:center; flex:0 0 auto;
    background: var(--surface-nested); border: 1px solid var(--border); }
  .pin-b { flex:1; min-width:0; cursor:pointer; }
  .pin-t { font-size: 14.5px; font-weight: 700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pin-t.done { text-decoration: line-through; color: var(--text-secondary); }
  .pin-m { font-size: 12px; color: var(--text-secondary); margin-top: 3px; }
  .pin-chk { flex:0 0 auto; width: 26px; height: 26px; border-radius: 8px; border: 1.6px solid var(--border-input);
    display:grid; place-items:center; cursor:pointer; background:var(--surface-card); color:var(--on-accent); transition: all .15s; }
  .pin-chk.on { background: var(--module-1); border-color: var(--module-1); }
  .pin-chk svg { opacity: 0; }
  .pin-chk.on svg { opacity: 1; }
  .pin-step { flex:0 0 auto; display:flex; gap: 7px; }
  .pin-step button { width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--border-input);
    background: var(--surface-nested); color: var(--text); font-size: 18px; line-height: 1; cursor:pointer;
    display:grid; place-items:center; transition: all .15s; }
  .pin-step button:hover { background: var(--accent-muted); border-color: var(--accent); }
  .pin-empty { grid-column: 1 / -1; padding: 26px 20px; text-align:center; color: var(--text-secondary); font-size: 13px; line-height: 1.7;
    background: var(--surface-card); border: 1px dashed var(--border-input); border-radius: var(--radius-tile); }
  .pin-empty .mini-star { display:inline-flex; vertical-align:-2px; color: var(--module-3); }

  /* ---------- toolbar in module view ---------- */
  .toolbar { display:flex; align-items:center; gap:10px; margin: 14px 0 12px; }
  .btn { background:var(--accent); color:var(--on-accent); border:none; border-radius:10px; padding:10px 18px; font-size:14px; cursor:pointer;
    font-weight:700; box-shadow: var(--shadow-card); transition: filter .15s, transform .1s; display:inline-flex; align-items:center; gap:7px; }
  .btn:hover { filter: brightness(1.12); } .btn:active { transform: translateY(1px); }
  .btn.ghost { background:var(--surface-card); color:var(--text-secondary); border:1px solid var(--border-input); box-shadow:none; font-weight:500; }
  .btn.ghost:hover { color:var(--text); }
  .btn.danger { background:var(--danger); }
  .spacer { flex:1; }
  input, textarea { font-family:var(--font); font-size:14px; border:1px solid var(--border-input); border-radius:10px;
    padding:9px 12px; background:var(--surface-card); color:var(--text); outline:none; transition: border-color .15s, box-shadow .15s; width:100%; }
  input:focus, textarea:focus { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-muted); }
  textarea { resize:vertical; min-height:80px; }
  .search-box { position:relative; width: 240px; }
  .search-box svg { position:absolute; left:11px; top:50%; transform:translateY(-50%); color:var(--text-tertiary); pointer-events:none; }
  .search-box input { padding-left:34px; }

  /* module hero header (per-type summary) */
  .hero { display:flex; align-items:center; gap: 13px; padding: 12px 16px; border-radius: var(--radius-tile);
    background: var(--surface-card); border: 1px solid var(--border); box-shadow: var(--shadow-card); margin-bottom: 4px; position:relative; overflow:hidden; }
  .hero.has-cover { padding: 0; min-height: 96px; }
  .hero.has-cover .hero-bg { position:absolute; inset:0; background-size:cover; background-position:center; }
  .hero.has-cover .hero-bg::after { content:""; position:absolute; inset:0; background: linear-gradient(90deg, var(--surface-card) 28%, color-mix(in srgb, var(--surface-card) 60%, transparent) 55%, transparent 80%); }
  .hero.has-cover > .hero-inner { position:relative; z-index:1; padding: 12px 16px; display:flex; align-items:center; gap:13px; }
  .hero-ic { width: 40px; height: 40px; border-radius: 11px; display:grid; place-items:center; flex:0 0 auto; }
  .hero-tx { min-width:0; flex:1; }
  .hero-row { display:flex; align-items:baseline; gap: 9px; flex-wrap:wrap; }
  .hero-v { font-size: 20px; font-weight: 800; letter-spacing: -.02em; line-height: 1; }
  .hero-l { font-size: 13px; color: var(--text-secondary); }

  /* record thumbnail + custom field meta tags */
  .rec .thumb { width:48px; height:48px; border-radius:var(--radius-tile); object-fit:cover; flex:0 0 auto; margin-right:2px; }
  .rec .meta-line { display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-top:4px; flex:1 0 100%; }
  .rec .meta-tag { font-size:12px; font-weight:600; color:var(--text-secondary); }
  .rec .meta-tag::before { content:"·"; margin-right:6px; color:var(--text-tertiary); }
  .rec .meta-tag:first-child::before { display:none; }

  /* ---- layout variants (open-ended: add .rec-layout-xxx in <style> to extend) ---- */
  /* feature: 大图在上 + 标题 + 正文在下 */
  .rec.rec-layout-feature { padding:0; overflow:hidden; }
  .rec.rec-layout-feature .top { flex-direction:column; align-items:stretch; }
  .rec.rec-layout-feature .thumb { width:100%; height:160px; border-radius:0; margin:0; }
  .rec.rec-layout-feature .feat-title { padding:12px 16px 4px; font-size:15px; font-weight:700; color:var(--text); }
  .rec.rec-layout-feature .feat-body { padding:0 16px 14px; font-size:13px; color:var(--text-secondary); line-height:1.55; }
  /* quote: 大字居中 + 留白 */
  .rec.rec-layout-quote { padding:24px 20px; }
  .rec.rec-layout-quote .quote-text { font-size:18px; font-weight:600; line-height:1.6; color:var(--text); }
  .rec.rec-layout-quote .quote-meta { margin-top:10px; font-size:12px; color:var(--text-tertiary); }


  /* module two-column layout: 左记录 / 右统计侧栏 */
  .mod-layout { display:grid; grid-template-columns: 1fr 300px; gap: 16px; align-items: start; margin-top: 14px; }
  .mod-side { display:flex; flex-direction:column; gap: 12px; position: sticky; top: 16px; }
  .side-card { background:var(--surface-card); border:1px solid var(--border); border-radius:var(--radius-tile); box-shadow:var(--shadow-card); padding:14px 15px; }
  .side-card .sh { display:flex; align-items:center; gap:8px; font-size:12.5px; font-weight:800; margin-bottom:10px; }
  .side-card .sh svg { color:var(--text-tertiary); }
  .stat-row { display:flex; align-items:center; justify-content:space-between; padding:6px 0; border-bottom:1px solid var(--border); }
  .stat-row:last-child { border-bottom:none; padding-bottom:0; }
  .stat-row .k { font-size:12.5px; color:var(--text-secondary); display:flex; align-items:center; gap:7px; }
  .stat-row .k .kd { width:8px; height:8px; border-radius:50%; flex:0 0 auto; }
  .stat-row .val { font-size:14px; font-weight:800; letter-spacing:-.01em; }
  /* 分类占比条 */
  .catbar { margin-top:4px; }
  .catbar .cbrow { display:flex; align-items:center; gap:9px; padding:7px 0; }
  .catbar .cbrow .cbn { font-size:12.5px; color:var(--text); width:52px; flex:0 0 auto; }
  .catbar .cbrow .cbt { flex:1; height:8px; border-radius:999px; background:var(--border); overflow:hidden; }
  .catbar .cbrow .cbt i { display:block; height:100%; border-radius:999px; }
  .catbar .cbrow .cbv { font-size:12px; color:var(--text-secondary); width:56px; text-align:right; flex:0 0 auto; }
  /* 大环形（进度/打卡侧栏） */
  .side-ring { display:flex; flex-direction:column; align-items:center; gap:8px; padding:6px 0 2px; }
  .side-ring .dial { position:relative; width:120px; height:120px; }
  .side-ring .dial svg.gauge { transform: rotate(-90deg); width:120px; height:120px; }
  .side-ring .dial .mid { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; }
  .side-ring .big { font-size:26px; font-weight:800; letter-spacing:-.02em; }
  .side-ring .cap { font-size:12px; color:var(--text-secondary); }

  /* finance summary minis */
  .mod-summary { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom: 4px; }
  .mini { background:var(--surface-card); border:1px solid var(--border); border-radius:var(--radius-tile); box-shadow:var(--shadow-card); padding:12px 14px; }
  .mini .l { font-size:12px; color:var(--text-secondary); }
  .mini .v { font-size:19px; font-weight:800; margin-top:3px; letter-spacing:-.02em; }

  /* record list — 行式列表 */
  .rec-grid { display:flex; flex-direction:column; gap:9px; }
  .rec { position:relative; background:var(--surface-card); border:1px solid var(--border); border-radius:var(--radius-tile); box-shadow:var(--shadow-card); padding:14px 16px; transition: border-color .12s, box-shadow .15s; }
  .rec:hover { border-color: var(--border-input); box-shadow: var(--shadow-overlay); }
  .rec .top { display:flex; align-items:center; gap:12px; }
  .rec .chk { flex:0 0 auto; width:23px; height:23px; border-radius:7px; border:1.6px solid var(--border-input); display:grid; place-items:center;
    cursor:pointer; background:var(--surface-card); color:var(--on-accent); transition: all .15s; }
  .rec .chk.on { background:var(--module-1); border-color:var(--module-1); }
  .rec .chk svg { opacity:0; } .rec .chk.on svg { opacity:1; }
  .rec .body { flex:1; min-width:0; cursor:pointer; display:flex; align-items:center; gap:11px; flex-wrap:wrap; }
  .rec .rname { font-weight:700; font-size:14.5px; letter-spacing:-.01em; flex:0 1 auto; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:100%; }
  .rec .rname.done { text-decoration:line-through; color:var(--text-secondary); }
  .rec .rmeta { display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
  .rec .rnote { flex:1 0 100%; color:var(--text-secondary); font-size:12.5px; margin-top:5px; white-space:pre-wrap; line-height:1.5;
    overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  .badge { display:inline-flex; align-items:center; gap:5px; padding:2px 9px; border-radius:999px; font-size:11.5px; font-weight:700; }
  .badge .dot { width:6px; height:6px; border-radius:50%; background:currentColor; }
  .rec .acts { position:absolute; top:50%; right:8px; transform:translateY(-50%); display:flex; gap:1px; opacity:0; transition: opacity .15s; background:var(--surface-card); }
  .rec:hover .acts { opacity:1; }
  .rec .acts button { border:none; background:transparent; color:var(--text-tertiary); cursor:pointer;
    width:28px; height:28px; border-radius:7px; display:grid; place-items:center; transition: all .15s; }
  .rec .pin-btn:hover { background:var(--surface-nested); color:var(--module-3); }
  .rec .pin-btn.on { color:var(--module-3); opacity:1; } .rec .pin-btn.on svg { fill: var(--module-3); }
  .rec:has(.pin-btn.on) .acts { opacity:1; }
  .rec .del:hover { background:var(--danger-muted); color:var(--danger); }
  .rec .pbar { flex:1; min-width:80px; height:6px; border-radius:999px; background:var(--border); overflow:hidden; }
  .rec .pbar i { display:block; height:100%; border-radius:999px; }
  .rec .amt { font-size:15px; font-weight:800; letter-spacing:-.02em; white-space:nowrap; margin-left:auto; }
  .rec .amt.exp { color:var(--danger); } .rec .amt.inc { color:var(--module-1); }
  .rec .streak { font-size:11.5px; color:var(--module-3); font-weight:700; display:inline-flex; align-items:center; gap:4px; }
  .rec .rdate { color:var(--text-secondary); font-size:11.5px; margin-left:auto; white-space:nowrap; }

  /* ============================================================
     TIMETABLE — 学校课表网格
     ============================================================ */
  .tt-grid { display:grid; gap:5px; margin-top:14px; }
  .tt-cell { background:var(--surface-card); border:1px solid var(--border); border-left:3px solid var(--module-2); border-radius:var(--radius-tile);
    padding:9px 11px; min-height:72px; cursor:pointer; transition:all .12s; display:flex; flex-direction:column; gap:3px; position:relative; }
  .tt-cell:hover { border-color:var(--border-input); box-shadow:var(--shadow-overlay); }
  .tt-cell.today { border-color:var(--accent); box-shadow:0 0 0 2px var(--accent-muted); }
  .tt-cell .tt-sub { font-weight:800; font-size:17px; color:var(--text); line-height:1.15; letter-spacing:.5px; }
  .tt-cell .tt-loc { font-size:11px; color:var(--text-secondary); display:flex; align-items:center; gap:3px; }
  .tt-cell .tt-teacher { font-size:11px; color:var(--text-tertiary); }
  .tt-cell .tt-note { font-size:10.5px; color:var(--accent); margin-top:2px; }
  .tt-cell.empty { display:grid; place-items:center; color:var(--text-tertiary); font-size:14px; border-left:3px solid var(--border); }
  .tt-cell.empty:hover { color:var(--accent); border-left-color:var(--accent-muted); }
  /* 补习课：紫色调标识 */
  .tt-cell.tutoring { border-left-color:var(--module-5); background:color-mix(in srgb, var(--module-5) 8%, var(--surface-card)); }
  .tt-cell.tutoring .tt-sub { color:var(--module-5); }
  .tt-cell.tutoring .tt-tag { position:absolute; top:4px; right:6px; font-size:9px; font-weight:700;
    background:var(--module-5); color:#fff; padding:1px 5px; border-radius:4px; letter-spacing:.5px; }
  /* 课间休息行 */
  .tt-break { grid-column:1 / -1; display:grid; grid-template-columns:60px 1fr; align-items:center; gap:5px; }
  .tt-break-label { grid-column:2; text-align:center; font-size:11px; font-weight:700; color:var(--text-tertiary);
    background:color-mix(in srgb, var(--text) 5%, transparent); border-radius:var(--radius-tile); padding:4px 8px;
    border:1px dashed var(--border); }
  .tt-break-time { font-size:9.5px; color:var(--text-tertiary); font-weight:600; }
  .tt-hd { font-size:11.5px; font-weight:700; color:var(--text-secondary); text-align:center; padding:6px 4px;
    border-radius:var(--radius-tile); }
  .tt-hd.today { color:var(--accent); }
  .tt-pd { font-size:10.5px; color:var(--text-tertiary); text-align:center; padding:4px; display:flex; flex-direction:column; justify-content:center; gap:1px; }
  .tt-pd .tt-period { font-weight:700; color:var(--text-secondary); font-size:11px; }
  .tt-pd .tt-time { font-size:9.5px; color:var(--text-tertiary); }
  .tt-del { position:absolute; top:3px; right:4px; opacity:0; background:transparent; border:none; color:var(--text-tertiary); cursor:pointer;
    font-size:13px; line-height:1; padding:2px; }
  .tt-cell:hover .tt-del { opacity:1; }
  .tt-del:hover { color:var(--danger); }
  /* 自定义时段分区 */
  .tt-custom-section { margin-top:22px; }
  .tt-section-hd { display:flex; align-items:baseline; gap:10px; padding-bottom:10px; border-bottom:1px dashed var(--border); margin-bottom:12px; }
  .tt-section-title { font-size:14px; font-weight:700; color:var(--text); display:inline-flex; align-items:center; gap:6px; }
  .tt-section-sub { font-size:11px; color:var(--text-secondary); }
  .tt-day-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:8px; }
  .tt-day-col { display:flex; flex-direction:column; gap:6px; }
  .tt-day-hd { font-size:11.5px; font-weight:700; color:var(--text-secondary); text-align:center; padding:5px; border-radius:var(--radius-tile); background:var(--surface-nested); }
  .tt-day-hd.today { color:var(--accent); background:var(--accent-muted); }
  .tt-day-cells { display:flex; flex-direction:column; gap:6px; }
  .tt-cell.custom { min-height:auto; }
  .tt-time-range { font-size:11px; color:var(--text-secondary); display:flex; align-items:center; gap:3px; font-weight:600; }
  .empty { text-align:center; color:var(--text-secondary); padding:50px 20px; }
  .empty .e { display:inline-grid; place-items:center; width:56px; height:56px; border-radius:16px; background:var(--surface-card); border:1px solid var(--border); color:var(--text-tertiary); margin-bottom:12px; }

  /* ============================================================
     TODO CALENDAR — 待办月历视图
     ============================================================ */
  .todo-cal { margin-top:8px; }
  .cal-month-hd { display:flex; align-items:baseline; gap:12px; padding-bottom:10px; border-bottom:1px dashed var(--border); margin-bottom:10px; }
  .cal-month-title { font-size:16px; font-weight:700; color:var(--text); }
  .cal-month-sub { font-size:11px; color:var(--text-secondary); }
  .cal-dow-row { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; margin-bottom:4px; }
  .cal-dow { font-size:11px; font-weight:700; color:var(--text-secondary); text-align:center; padding:4px; }
  .cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
  .cal-day { min-height:84px; padding:4px 5px; background:var(--surface-card); border:1px solid var(--border);
    border-radius:8px; cursor:pointer; transition:all .12s; display:flex; flex-direction:column; gap:3px; }
  .cal-day:hover { border-color:var(--border-input); box-shadow:var(--shadow-card); }
  .cal-day.today { border-color:var(--accent); box-shadow:0 0 0 2px var(--accent-muted); }
  .cal-day.other-month { background:transparent; border-style:dashed; opacity:.5; }
  .cal-day-num { font-size:11px; font-weight:700; color:var(--text-secondary); text-align:right; padding-right:2px; }
  .cal-day.today .cal-day-num { color:var(--accent); }
  .cal-items { display:flex; flex-direction:column; gap:2px; flex:1; }
  .cal-item { font-size:10px; color:var(--text); background:var(--surface-nested); border-radius:4px;
    padding:2px 4px; line-height:1.25; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; cursor:pointer; transition:all .1s; }
  .cal-item:hover { background:var(--border-input); }
  .cal-item.done { color:var(--text-tertiary); text-decoration:line-through; }
  .cal-item .cal-time { font-weight:700; color:var(--text-secondary); margin-right:2px; }
  .cal-more { font-size:9.5px; color:var(--text-tertiary); padding:0 4px; }
  .view-switch { flex:0 0 auto; }
  .view-switch .opt { min-width:auto; flex:0 0 auto; padding:8px 12px; display:inline-flex; align-items:center; gap:4px; }

  /* ---------- modal ---------- */
  .overlay { position:fixed; inset:0; background:color-mix(in srgb, var(--text) 44%, transparent); backdrop-filter: blur(3px); z-index:60;
    display:flex; align-items:center; justify-content:center; animation: fade .16s ease; }
  @keyframes fade { from { opacity:0; } }
  .modal { background:var(--surface-card); border-radius:20px; padding:26px; width:480px; max-width:92vw; max-height:90vh; overflow-y:auto;
    box-shadow:0 24px 60px color-mix(in srgb, var(--text) 26%, transparent); animation: pop .18s cubic-bezier(.2,.8,.3,1); }
  @keyframes pop { from { transform: translateY(10px) scale(.98); opacity:0; } }
  .modal h3 { font-size:19px; font-weight:800; letter-spacing:-.01em; }
  .modal .sub { color:var(--text-secondary); font-size:13px; margin:5px 0 18px; }
  .field { margin-bottom:14px; }
  .field label { display:block; color:var(--text-secondary); font-size:13px; margin-bottom:6px; }
  .frow { display:flex; gap:12px; } .frow .field { flex:1; }
  .seg { display:flex; gap:8px; flex-wrap:wrap; }
  .seg .opt { flex:1; min-width:64px; text-align:center; padding:10px; border-radius:11px; border:1px solid var(--border-input);
    cursor:pointer; font-size:13px; font-weight:600; color:var(--text-secondary); transition: all .12s; }
  .seg .opt.on { background:var(--accent); border-color:var(--accent); color:var(--on-accent); }

  /* 合并模块顶部 sub-tab 切换条 */
  .sub-tabs { display:flex; gap:6px; padding:8px; margin-bottom:14px;
    background:var(--card-tint,#f5efde); border-radius:13px; border:1px solid var(--border-input); }
  .seg-tab { display:inline-flex; align-items:center; gap:6px; padding:8px 16px;
    border-radius:9px; border:none; background:transparent; color:var(--text-secondary);
    font-size:14px; font-weight:600; cursor:pointer; transition: all .15s; }
  .seg-tab:hover { background:rgba(0,0,0,.04); }
  .seg-tab.active { background:var(--accent); color:var(--on-accent); box-shadow:0 2px 6px rgba(0,0,0,.08); }
  #sub-content { min-height:200px; }
  #sub-content .header { display:none; } /* 子模块的 header 已在 sub-tabs 之上展示 */
  .modal-actions { display:flex; align-items:center; gap:10px; margin-top:22px; }
  .link-danger { color:var(--danger); background:none; border:none; font-size:14px; font-weight:600; cursor:pointer; padding:8px 10px; border-radius:8px; }
  .link-danger:hover { background:var(--danger-muted); }

  /* ============================================================
     BENTO DASHBOARD — 首页复杂网格布局（墨色中性 · 高密度）
     ============================================================ */
  .bento { display:grid; grid-template-columns: repeat(12, 1fr); gap:16px; align-items:stretch; }
  .bento > * { min-width:0; }   /* 允许网格轨道收窄，避免窄屏内容溢出 */
  .b3{grid-column:span 3} .b4{grid-column:span 4} .b5{grid-column:span 5}
  .b6{grid-column:span 6} .b7{grid-column:span 7} .b8{grid-column:span 8} .b12{grid-column:span 12}

  /* 分组标题（EN 副标题 + 中文标题 + 分隔线） */
  .sec-grp { display:flex; align-items:center; gap:12px; margin:26px 2px 14px; }
  .sec-grp .bar { width:4px; height:19px; border-radius:2px; background:var(--accent); flex:0 0 auto; }
  .sec-grp .zh { font-size:16px; font-weight:800; letter-spacing:-.02em; }
  .sec-grp .en { font-size:10.5px; font-weight:800; letter-spacing:.15em; color:var(--text-tertiary); }
  .sec-grp .line { flex:1; height:1px; background:var(--border); }

  /* 通用瓷砖 */
  .tile { background:var(--surface-card); border:1px solid var(--border); border-radius:var(--radius-card); box-shadow:var(--shadow-card);
    padding:18px 20px; display:flex; flex-direction:column; position:relative; }
  .tile-h { display:flex; align-items:center; gap:9px; margin-bottom:14px; }
  .tile-h .tic { color:var(--text-tertiary); display:flex; }
  .tile-h .en { font-size:9.5px; font-weight:800; letter-spacing:.14em; color:var(--text-tertiary); line-height:1; }
  .tile-h .zh { font-size:14px; font-weight:800; letter-spacing:-.01em; line-height:1.15; }
  .tile-h .tt { display:flex; flex-direction:column; gap:3px; }
  .tile-h .r { margin-left:auto; font-size:12px; color:var(--text-secondary); font-weight:700; }

  /* 整体情况瓷砖 */
  .ov2-body { display:grid; grid-template-columns:1fr 300px; gap:22px; flex:1; align-items:stretch; }
  .ov2-body .rings { align-content:center; }
  .ov2-side { position:relative; overflow:hidden; border-radius:var(--radius-card);
    background:linear-gradient(150deg,#3d3220 0%,#2b2215 62%,#1f1810 100%); box-shadow:var(--shadow-overlay);
    padding:20px; display:flex; flex-direction:column; justify-content:space-between; gap:12px; }
  .ov2-side::before { content:""; position:absolute; width:190px; height:190px; border-radius:50%; right:-70px; top:-80px;
    background:radial-gradient(circle,rgba(196,106,42,.4),transparent 70%); pointer-events:none; }
  .ov2-side::after { content:""; position:absolute; width:150px; height:150px; border-radius:50%; left:-55px; bottom:-70px;
    background:radial-gradient(circle,rgba(61,107,79,.32),transparent 70%); pointer-events:none; }
  .ov2-stat { position:relative; z-index:1; display:flex; align-items:center; gap:13px; cursor:pointer;
    padding:12px 4px; border-radius:var(--radius-tile); transition:background .15s; }
  .ov2-stat:hover { background:rgba(244,243,240,.06); }
  .ov2-stat + .ov2-stat { border-top:1px solid rgba(244,243,240,.09); }
  .ov2-stat .s-ic { width:40px; height:40px; border-radius:12px; display:grid; place-items:center; flex:0 0 auto;
    background:rgba(244,243,240,.08); box-shadow:inset 0 0 0 1px rgba(244,243,240,.1); }
  .ov2-stat .s-tx { min-width:0; }
  .ov2-stat .s-v { font-size:24px; font-weight:800; letter-spacing:-.03em; line-height:1.05; color:#f4f3f0;
    font-variant-numeric:tabular-nums; }
  .ov2-stat .s-l { font-size:11.5px; color:rgba(244,243,240,.55); margin-top:3px; }

  /* 大时钟卡（暗色·点缀光晕） */
  .clock-card { position:relative; overflow:hidden; border-radius:var(--radius-sheet);
    background:linear-gradient(140deg,#3d3220 0%,#2b2215 60%,#1f1810 100%); color:#f1e8d3;
    padding:26px 28px; box-shadow:var(--shadow-overlay); display:flex; flex-direction:column; justify-content:space-between; min-height:196px; }
  .clock-card::before { content:""; position:absolute; width:220px; height:220px; border-radius:50%; right:-70px; top:-90px;
    background:radial-gradient(circle,rgba(196,106,42,.4),transparent 70%); }
  .clock-card::after { content:""; position:absolute; width:170px; height:170px; border-radius:50%; left:-60px; bottom:-80px;
    background:radial-gradient(circle,rgba(61,107,79,.3),transparent 70%); }
  .clock-card > * { position:relative; z-index:1; }
  .clock-card .hi { font-size:24px; font-weight:800; letter-spacing:-.02em; }
  .clock-card .sub { font-size:12.5px; opacity:.62; margin-top:5px; max-width:230px; line-height:1.5; }
  .clock-card .clk { font-size:clamp(38px,4.4vw,50px); font-weight:800; letter-spacing:.01em; font-variant-numeric:tabular-nums; line-height:1; }
  .clock-card .cmeta { display:flex; align-items:center; gap:10px; margin-top:9px; font-size:12px; opacity:.6; }
  .clock-card .cmeta .dot { width:4px; height:4px; border-radius:50%; background:currentColor; }

  /* 焦点/统计瓷砖 */
  .focus-list { display:flex; flex-direction:column; gap:9px; }
  .focus-row { display:flex; align-items:center; gap:11px; }
  .focus-row .fic { width:30px; height:30px; border-radius:9px; display:grid; place-items:center; flex:0 0 auto;
    background:var(--surface-nested); border:1px solid var(--border); }
  .focus-row .ft { flex:1; min-width:0; cursor:pointer; }
  .focus-row .fn { font-size:13.5px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .focus-row .fn.done { text-decoration:line-through; color:var(--text-secondary); }
  .focus-row .fm { font-size:11px; color:var(--text-secondary); margin-top:2px; }
  .focus-empty { color:var(--text-secondary); font-size:12.5px; line-height:1.7; padding:6px 0; }
  .stat-big { font-size:32px; font-weight:800; letter-spacing:-.03em; line-height:1; }
  .stat-big small { font-size:15px; color:var(--text-secondary); font-weight:700; letter-spacing:0; }
  .stat-cap { font-size:12px; color:var(--text-secondary); margin-top:7px; }
  .prog-line { height:7px; border-radius:999px; background:var(--border); overflow:hidden; margin-top:auto; }
  .prog-line i { display:block; height:100%; border-radius:999px; }

  /* 习惯追踪周网格表 */
  .habit-tb { width:100%; border-collapse:collapse; }
  .habit-tb th { font-size:10.5px; font-weight:700; color:var(--text-tertiary); padding:0 0 9px; text-align:center; }
  .habit-tb th.hh { text-align:left; }
  .habit-tb th.hr { text-align:right; }
  .habit-tb td { padding:5px 0; text-align:center; vertical-align:middle; }
  .habit-tb td.hn { text-align:left; font-size:12.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:118px; }
  .habit-tb td.hn .hdot { display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:7px; vertical-align:middle; }
  .habit-tb td.hrate { text-align:right; font-size:12.5px; font-weight:800; letter-spacing:-.02em; }
  .hcell { display:inline-grid; place-items:center; width:22px; height:22px; border-radius:7px; color:var(--on-accent); cursor:pointer; transition:transform .12s; }
  .hcell:hover { transform:scale(1.12); }
  .hcell.on { background:var(--module-1); }
  .hcell.off { background:var(--surface-nested); border:1px solid var(--border); }
  .hcell svg { opacity:0; } .hcell.on svg { opacity:1; }
  .habit-tb .tdcol { background:var(--accent-muted); }
  .habit-tb col.todaycol { background:var(--accent-muted); }

  /* 待办清单（仪表盘式） */
  .tk-head { display:flex; align-items:center; gap:10px; margin-bottom:8px; }
  .tk-head .pct { font-size:22px; font-weight:800; letter-spacing:-.03em; }
  .tk-head .cnt { font-size:12px; color:var(--text-secondary); font-weight:700; }
  .tk-head .bar { flex:1; height:6px; border-radius:999px; background:var(--border); overflow:hidden; }
  .tk-head .bar i { display:block; height:100%; border-radius:999px; background:var(--accent); }
  .tk-list { display:flex; flex-direction:column; }
  .tk-row { display:flex; align-items:center; gap:11px; padding:8px 0; border-bottom:1px solid var(--border); }
  .tk-row:last-child { border-bottom:none; }
  .tk-chk { flex:0 0 auto; width:20px; height:20px; border-radius:6px; border:1.6px solid var(--border-input);
    display:grid; place-items:center; cursor:pointer; background:var(--surface-card); color:var(--on-accent); transition:all .15s; }
  .tk-chk.on { background:var(--module-1); border-color:var(--module-1); }
  .tk-chk svg { opacity:0; } .tk-chk.on svg { opacity:1; }
  .tk-name { flex:1; min-width:0; font-size:13.5px; font-weight:600; cursor:pointer; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .tk-name.done { text-decoration:line-through; color:var(--text-secondary); }

  /* 今日课表（横向卡片条） */
  .tc-strip { display:flex; gap:12px; overflow-x:auto; padding:4px 2px 8px; }
  .tt-tabs { flex:0 0 auto; display:inline-flex; gap:4px; background:var(--surface-nested); border-radius:8px; padding:3px; margin-left:auto; }
  .tt-tabs .opt { flex:0 0 auto; min-width:auto; padding:6px 10px; font-size:11.5px; border-radius:6px; cursor:pointer; color:var(--text-secondary); font-weight:600; }
  .tt-tabs .opt.on { background:var(--surface-card); color:var(--accent); box-shadow:var(--shadow-card); }
  .tt-foot { display:flex; align-items:center; gap:6px; }

  /* 阅读专属：阅后感/关键句/标签 */
  .read-extra { margin-top:14px; padding-top:14px; border-top:1px dashed var(--border); }
  .read-extra .field > label { display:inline-flex; align-items:center; gap:5px; color:var(--text-secondary); }
  .quote-list { display:flex; flex-direction:column; gap:6px; margin-bottom:6px; }
  .quote-row { display:flex; gap:6px; align-items:center; }
  .quote-row .q-text { flex:1; }
  .quote-row .q-del { background:transparent; border:1px solid var(--border); color:var(--text-tertiary);
    width:26px; height:26px; border-radius:6px; cursor:pointer; font-size:14px; }
  .quote-row .q-del:hover { color:var(--danger); border-color:var(--danger); }
  .q-add { font-size:12px; padding:6px 10px; }
  .read-meta { margin-top:10px; padding:8px 10px; background:var(--surface-nested); border-radius:8px;
    border-left:3px solid var(--module-2); display:flex; flex-direction:column; gap:6px; }
  .rm-ref { display:flex; gap:6px; align-items:flex-start; font-size:11.5px; color:var(--text-secondary); line-height:1.4; }
  .rm-ic { color:var(--module-2); flex:0 0 auto; }
  .rm-txt { flex:1; }
  .rm-quotes { display:flex; flex-direction:column; gap:4px; }
  .rm-q { display:flex; gap:5px; align-items:baseline; font-size:11.5px; color:var(--text-secondary); line-height:1.35; }
  .rm-quote { color:var(--module-5); flex:0 0 auto; }
  .rm-qtxt { flex:1; font-style:italic; }
  .rm-pg { font-size:10px; color:var(--text-tertiary); flex:0 0 auto; }
  .rm-more { font-size:10px; color:var(--text-tertiary); }
  .rm-tags { display:flex; gap:5px; flex-wrap:wrap; }
  .rm-tag { display:inline-flex; align-items:center; gap:3px; font-size:10.5px; padding:2px 7px;
    background:var(--surface-card); border:1px solid var(--border); border-radius:999px; color:var(--module-3); }

  /* 月度复盘 */
  .rv-title { display:inline-flex; align-items:center; gap:6px; font-weight:700; color:var(--text); font-size:14px; }
  .rv-month-nav { display:flex; align-items:center; gap:10px; margin-left:auto; }
  .rv-month-name { font-size:13px; font-weight:700; color:var(--accent); min-width:80px; text-align:center; }
  .rv-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:12px; margin-top:14px; }
  .rv-card { background:var(--surface-card); border:1px solid var(--border); border-radius:var(--radius-card); padding:14px; }
  .rv-hd { font-size:13px; font-weight:700; color:var(--text); margin-bottom:10px; display:flex; align-items:center; gap:6px; }
  .rv-row { display:grid; grid-template-columns:1fr 2fr auto auto; gap:10px; align-items:center; padding:6px 0; font-size:12px; }
  .rv-row + .rv-row { border-top:1px dashed var(--border); }
  .rv-name { color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .rv-bar { height:7px; background:var(--surface-nested); border-radius:999px; overflow:hidden; }
  .rv-bar > i { display:block; height:100%; background:var(--accent); border-radius:999px; transition:width .3s; }
  .rv-row.done .rv-bar > i { background:var(--module-3); }
  .rv-row.ok .rv-bar > i { background:var(--accent); }
  .rv-row.warn .rv-bar > i { background:var(--danger); }
  .rv-val { font-weight:700; color:var(--text); font-variant-numeric:tabular-nums; }
  .rv-g { font-weight:400; color:var(--text-tertiary); font-size:11px; }
  .rv-pct { font-weight:700; font-size:13px; min-width:40px; text-align:right; }
  .rv-pct.done { color:var(--module-3); }
  .rv-pct.ok { color:var(--accent); }
  .rv-pct.warn { color:var(--danger); }
  .rv-budget { display:flex; align-items:center; gap:8px; margin-top:14px; padding:12px 14px;
    background:var(--surface-card); border:1px solid var(--border); border-radius:var(--radius-card); }
  .rvb-label { font-size:12px; color:var(--text-secondary); display:inline-flex; align-items:center; gap:5px; }
  .rv-budget input { width:120px; padding:6px 8px; border:1px solid var(--border-input); border-radius:6px;
    background:var(--surface-nested); color:var(--text); font-size:12px; }
  .rv-budget .btn { padding:6px 12px; font-size:12px; }
  .tc-strip::-webkit-scrollbar { height:6px; }
  .tc-strip::-webkit-scrollbar-thumb { background:var(--border); border-radius:999px; }
  .tc-card { flex:0 0 auto; min-width:140px; padding:12px 14px; background:var(--surface-nested);
    border:1px solid var(--border); border-left:3px solid var(--module-2); border-radius:var(--radius-tile);
    cursor:pointer; transition:all .15s; }
  .tc-card:hover { border-color:var(--module-2); box-shadow:var(--shadow-card); transform:translateY(-1px); }
  .tc-period { font-size:11px; color:var(--text-tertiary); letter-spacing:.4px; margin-bottom:4px; }
  .tc-sub { font-size:15px; font-weight:700; color:var(--text); margin-bottom:6px; }
  .tc-loc, .tc-teacher { font-size:12px; color:var(--text-secondary); display:flex; align-items:center; gap:4px; margin-top:2px; }
  .tc-note { font-size:11px; color:var(--text-tertiary); margin-top:4px; font-style:italic; }
  .tc-card.tutoring { border-left-color:var(--module-5); background:color-mix(in srgb, var(--module-5) 8%, var(--surface-nested)); }
  .tc-card.tutoring .tc-sub { color:var(--module-5); }

  /* 番茄钟（暗色炫酷卡） */
  .pomo { position:relative; overflow:hidden; border-radius:var(--radius-card); text-align:center;
    background:linear-gradient(155deg,#302f2c,#1e1d1b); color:#f4f3f0; padding:22px 20px; box-shadow:var(--shadow-overlay);
    display:flex; flex-direction:column; }
  .pomo::before { content:""; position:absolute; width:180px; height:180px; border-radius:50%; left:50%; top:-60px; transform:translateX(-50%);
    background:radial-gradient(circle,rgba(197,93,79,.28),transparent 70%); }
  .pomo > * { position:relative; z-index:1; }
  .pomo .pen { font-size:9.5px; font-weight:800; letter-spacing:.16em; opacity:.55; }
  .pomo .pzh { font-size:13px; font-weight:800; margin-top:3px; }
  .pomo .ring-wrap { position:relative; width:150px; height:150px; margin:14px auto 12px; }
  .pomo .ring-wrap svg { transform:rotate(-90deg); }
  .pomo .ptime { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; }
  .pomo .ptime .t { font-size:32px; font-weight:800; font-variant-numeric:tabular-nums; letter-spacing:.01em; }
  .pomo .ptime .s { font-size:11px; opacity:.6; }
  .pomo .pctl { display:flex; gap:8px; justify-content:center; margin-bottom:14px; }
  .pomo .plink { display:flex; flex-direction:column; gap:5px; margin:6px 0 12px; text-align:left; }
  .pomo .plink-l { font-size:10.5px; opacity:.7; display:inline-flex; align-items:center; gap:4px; }
  .pomo .plink-sel { width:100%; padding:6px 8px; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.18);
    border-radius:6px; color:#f4f3f0; font-size:12px; }
  .pomo .plink-sel optgroup { color:#f4f3f0; font-style:normal; }
  .pomo .plink-sel option { color:#2a2a2a; background:#f4f3f0; }
  .pomo .pctl button { border:1px solid rgba(244,243,240,.22); background:rgba(244,243,240,.08); color:#f4f3f0;
    border-radius:9px; padding:8px 16px; font-size:13px; font-weight:700; cursor:pointer; transition:all .15s; }
  .pomo .pctl button:hover { background:rgba(244,243,240,.16); }

const sync = {
  status: "offline",   // offline | syncing | synced | error
  user: null,
  pushTimer: null,

  async init() {
    if (!sb) return;
    // 检查已有登录会话
    const { data: { session } } = await sb.auth.getSession();
    if (session && session.user) {
      this.user = session.user;
      this.setStatus("syncing");
      await this.pull();
      this.setStatus("synced");
    }
    // 监听登录/登出变化
    sb.auth.onAuthStateChange(async (event, session) => {
      if (event === "SIGNED_IN" && session) {
        this.user = session.user;
        this.setStatus("syncing");
        await this.pull();
        this.setStatus("synced");
      } else if (event === "SIGNED_OUT") {
        this.user = null;
        this.setStatus("offline");
      }
      this.updateUI();
    });
    this.updateUI();
  },

  async signIn(email, password) {
    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    if (error) throw error;
    return data;
  },

  async signUp(email, password) {
    const { data, error } = await sb.auth.signUp({ email, password });
    if (error) throw error;
    // 注册成功后如果是 email confirm 模式，data.session 为 null
    return data;
  },

  async signOut() {
    await sb.auth.signOut();
    this.user = null;
    this.setStatus("offline");
    this.updateUI();
  },

  async pull() {
    if (!this.user) return;
    const { data: row, error } = await sb
      .from("workbench_data")
      .select("data")
      .eq("user_id", this.user.id)
      .maybeSingle();
    if (error) {
      console.warn("拉取云端数据失败:", error.message);
      this.setStatus("error");
      return;
    }
    if (row && row.data) {
      // 云端数据为主，但保留本地临时字段（头像、番茄钟统计）
      const cloud = row.data;
      if (data.__avatar) cloud.__avatar = data.__avatar;
      if (data.__pomo) cloud.__pomo = data.__pomo;
      if (data.__trend) cloud.__trend = data.__trend;
      data = cloud;
      store.save();
      render();
    }
  },

  async push() {
    if (!this.user) return;
    this.setStatus("syncing");
    const { error } = await sb
      .from("workbench_data")
      .upsert({
        user_id: this.user.id,
        data: data,
        updated_at: new Date().toISOString(),
      });
    if (error) {
      console.warn("推送云端失败:", error.message);
      this.setStatus("error");
    } else {
      this.setStatus("synced");
    }
    this.updateUI();
  },

  debouncedPush() {
    if (!this.user) return;
    clearTimeout(this.pushTimer);
    this.pushTimer = setTimeout(() => this.push(), 800);
  },

  setStatus(s) { this.status = s; this.updateUI(); },

  updateUI() {
    const dot = document.getElementById("syncDot");
    const txt = document.getElementById("syncStatus");
    const btn = document.getElementById("authBtn");
    if (!dot || !txt) return;
    const map = {
      offline: { dot:"offline", text:"未登录·仅本地" },
      syncing: { dot:"syncing", text:"同步中…" },
      synced:  { dot:"synced",  text:"已同步·云端" },
      error:   { dot:"error",   text:"同步失败" },
    };
    const m = map[this.status] || map.offline;
    dot.className = "sync-dot " + m.dot;
    txt.textContent = m.text;
    if (btn) {
      if (this.user) {
        btn.textContent = "退出登录";
        btn.onclick = () => { this.signOut(); };
      } else {
        btn.textContent = "登录 / 注册";

    document.getElementById("loginEmail").focus();
  },

  hideLogin() {
    document.getElementById("loginOverlay").classList.remove("show");
    document.getElementById("loginErr").textContent = "";
  },
};

/* ============================================================
   IndexedDB 媒体存储（照片/音频存本地，不占云端空间）
   ============================================================ */
const mediaDB = {
  db: null,
  async init() {
    if (this.db) return this.db;
    return new Promise((resolve, reject) => {
      const req = indexedDB.open("workbench_media", 1);
      req.onupgradeneeded = e => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains("media")) {
          db.createObjectStore("media", { keyPath: "id" });
        }
      };
      req.onsuccess = e => { this.db = e.target.result; resolve(this.db); };
      req.onerror = e => { console.warn("IndexedDB 打开失败", e); reject(e); };
    });
  },
  async put(id, blob) {
    const db = await this.init();
    return new Promise((resolve, reject) => {
      const tx = db.transaction("media", "readwrite");
      tx.objectStore("media").put({ id, blob });
      tx.oncomplete = resolve;
      tx.onerror = reject;
    });
  },
  async get(id) {
    const db = await this.init();
    return new Promise((resolve) => {
      const tx = db.transaction("media", "readonly");
      const req = tx.objectStore("media").get(id);
      req.onsuccess = () => resolve(req.result ? req.result.blob : null);
      req.onerror = () => resolve(null);
    });
  },
  async del(id) {
    const db = await this.init();
    return new Promise((resolve) => {
      const tx = db.transaction("media", "readwrite");
      tx.objectStore("media").delete(id);
      tx.oncomplete = resolve;
      tx.onerror = resolve;
    });
  },
  async getURL(id) {
    const blob = await this.get(id);
    return blob ? URL.createObjectURL(blob) : null;
  },
};

/* 图片压缩：maxWidth 800px，JPEG 0.7 质量（~50-100KB/张） */
async function compressImage(file) {
  const img = await new Promise((resolve, reject) => {
    const i = new Image();
    i.onload = () => resolve(i);
    i.onerror = reject;
    i.src = URL.createObjectURL(file);
  });
  const maxW = 800;
  const scale = Math.min(1, maxW / img.width);
  const w = Math.round(img.width * scale);
  const h = Math.round(img.height * scale);
  const canvas = document.createElement("canvas");
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext("2d");
  ctx.drawImage(img, 0, 0, w, h);
  return new Promise(resolve => canvas.toBlob(resolve, "image/jpeg", 0.7));
}

/* ============================================================
   媒体备份：下载（IndexedDB → ZIP）/ 上传（ZIP → IndexedDB）
   ============================================================ */
const backup = {
  // 遍历 IndexedDB 所有媒体，打包成 ZIP 下载
  async download() {
    const btn = document.getElementById("btnBackupDL");
    btn.disabled = true; btn.textContent = "打包中…";
    try {
      const db = await mediaDB.init();
      const tx = db.transaction("media", "readonly");
      const storeObj = tx.objectStore("media");
      const allKeys = await new Promise(resolve => {
        const req = storeObj.getAllKeys();
        req.onsuccess = () => resolve(req.result || []);
        req.onerror = () => resolve([]);
      });
      if (allKeys.length === 0) {
        alert("没有可备份的媒体文件（照片/音频）。");
        return;
      }
      const zip = new JSZip();
      const meta = { version: 1, count: allKeys.length, date: new Date().toISOString(), ids: [] };
      for (const id of allKeys) {
        const blob = await mediaDB.get(id);
        if (blob) {
          const ext = blob.type.includes("image") ? ".jpg" : blob.type.includes("audio") ? ".webm" : ".bin";
          zip.file(id + ext, blob);
          meta.ids.push(id);
        }
      }
      zip.file("_manifest.json", JSON.stringify(meta, null, 2));
      const zipBlob = await zip.generateAsync({ type: "blob", compression: "DEFLATE" });
      const url = URL.createObjectURL(zipBlob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `workbench-media-backup-${new Date().toISOString().slice(0,10)}.zip`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    } catch (e) {
      alert("备份失败：" + (e.message || e));
    } finally {
      btn.disabled = false; btn.textContent = "下载媒体备份";
    }
  },

  // 选择 ZIP 文件，解包后按 ID 存入 IndexedDB
  async upload(file) {
    const btn = document.getElementById("btnBackupUL");
    btn.disabled = true; btn.textContent = "恢复中…";
    try {
      const zip = await JSZip.loadAsync(file);
      let count = 0;
      const manifestFile = zip.file("_manifest.json");
      let manifestIds = null;
      if (manifestFile) {
        try {
          const m = JSON.parse(await manifestFile.async("string"));
          manifestIds = m.ids || null;
        } catch(e) {}
      }
      // 从 manifest 顺序恢复，或从文件名解析
      const ids = manifestIds || Object.keys(zip.files).filter(n => !n.startsWith("_")).map(n => n.replace(/\.(jpg|webm|bin)$/, ""));
      for (const id of ids) {
        // 找对应的 zip 文件（可能带扩展名）
        let entry = zip.file(id + ".jpg") || zip.file(id + ".webm") || zip.file(id + ".bin");
        if (!entry) {
          // 尝试直接用 ID 作为文件名
          entry = zip.file(id);
        }
        if (!entry) continue;
        const blob = await entry.async("blob");
        // 推断 MIME 类型
        let type = "application/octet-stream";
        if (entry.name.endsWith(".jpg")) type = "image/jpeg";
        else if (entry.name.endsWith(".webm")) type = "audio/webm";
        const typedBlob = new Blob([blob], { type });
        await mediaDB.put(id, typedBlob);
        count++;
      }
      alert(`媒体恢复完成，共恢复 ${count} 个文件。刷新页面后生效。`);
      render();
    } catch (e) {
      alert("恢复失败：" + (e.message || e));
    } finally {
      btn.disabled = false; btn.textContent = "上传媒体备份";
    }
  },
};

/* 本周（周一起）7 天的 ISO 日期 */
function weekDates(){
  const n=new Date(); const dow=(n.getDay()+6)%7; const mon=new Date(n); mon.setDate(n.getDate()-dow);
  const arr=[]; for(let i=0;i<7;i++){ const d=new Date(mon); d.setDate(mon.getDate()+i); arr.push(d.toISOString().slice(0,10)); }
  return arr;
}
function weekNum(){ const n=new Date(); const s=new Date(n.getFullYear(),0,1);
  return Math.ceil(((n-s)/86400000 + s.getDay()+1)/7); }

/* 秒级心跳：更新时钟；番茄钟运行时倒计时 */
function startClock(){ if(clockTimer) return; clockTimer=setInterval(heartbeat,1000); heartbeat(); }
function heartbeat(){
  const el=$("#clk"); if(el){ const n=new Date(); el.textContent=`${pad2(n.getHours())}:${pad2(n.getMinutes())}:${pad2(n.getSeconds())}`; }
  if(pomo.running){ pomo.remain--; if(pomo.remain<=0) completePomo(); pomoUpdate(); }
}
function pomoUpdate(){

  const fg=$("#pomo-fg"); if(fg){ const r=64,c=2*Math.PI*r; fg.style.strokeDashoffset=c*(1-pomo.remain/pomo.total); }
  const st=$("#pomo-status"); if(st) st.textContent=pomo.running?"专注中":"已暂停";
  const b=$("#pomo-toggle"); if(b) b.textContent=pomo.running?"暂停":"开始";
}
function completePomo(){ pomo.running=false; pomo.remain=pomo.total;
  data.__pomo=data.__pomo||{count:0,min:0}; data.__pomo.count++; data.__pomo.min+=Math.round(pomo.total/60);
  // 关联项目：自动累计进度/打卡
  const mins=Math.round(pomo.total/60);
  if(pomo.linkedKey && pomo.linkedId){
    const arr=data[pomo.linkedKey]||[];
    const x=arr.find(i=>i.id===pomo.linkedId);
    if(x){
      if(pomo.linkedType==="progress"){
        // 阅读/锻炼：按分钟累计到 current
        x.current=Math.max(0,(+x.current||0)+mins);
        x.note=(x.note||"")+`${x.note?" · ":""}${new Date().getMonth()+1}月${new Date().getDate()}日 番茄专注 ${mins} 分钟`;
      } else if(pomo.linkedType==="checkin"){
        // 习惯打卡：标记当日完成
        x.log=x.log||{}; const t=today(); x.log[t]=true;
        x.note=(x.note||"")+`${x.note?" · ":""}${new Date().getMonth()+1}月${new Date().getDate()}日 番茄专注 ${mins} 分钟`;
      }
      data.__pomo.linkedMin=(data.__pomo.linkedMin||0)+mins;
    }
  }
  store.save();
  const c=$("#pomo-count"); if(c) c.textContent=data.__pomo.count;
  const mn=$("#pomo-min"); if(mn) mn.textContent=data.__pomo.min;
  const lmn=$("#pomo-linked-min"); if(lmn) lmn.textContent=data.__pomo.linkedMin||0;
  // 若在主页且关联了阅读/锻炼/习惯，需要刷新卡片显示
  if(view==="home") renderHome();
}

/* ---------- ring svg ---------- */
function ringSVG(pct, color){
  const r=25, c=2*Math.PI*r, off=c*(1-Math.min(100,pct)/100);
  return `<svg class="gauge" viewBox="0 0 60 60"><circle cx="30" cy="30" r="${r}" fill="none" stroke="var(--border)" stroke-width="5.5"/>
    <circle cx="30" cy="30" r="${r}" fill="none" stroke="${color}" stroke-width="5.5" stroke-linecap="round"
      stroke-dasharray="${c}" stroke-dashoffset="${off}"/></svg>`;
}
function trendSVG(series){
  const w=560, h=170, padX=12, padTop=16, padBot=22;
  const max=Math.max(...series), min=Math.min(...series);
  const rng=(max-min)||1;
  const innerW=w-2*padX, innerH=h-padTop-padBot;
  const pts=series.map((v,i)=>{
    const x=padX+innerW*i/(series.length-1);
    const y=padTop+innerH*(1-(v-min)/rng);
    return [x,y];
  });
  const line=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area=line+` L ${padX+innerW} ${h-padBot} L ${padX} ${h-padBot} Z`;
  const dots=pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3.2" fill="var(--surface-card)" stroke="var(--module-2)" stroke-width="2"/>`).join('');
  return `<svg class="trend-svg" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet">
    <defs><linearGradient id="tg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--module-2)" stop-opacity=".22"/><stop offset="1" stop-color="var(--module-2)" stop-opacity="0"/></linearGradient></defs>
    <path d="${area}" fill="url(#tg)"/><path d="${line}" fill="none" stroke="var(--module-2)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>${dots}</svg>`;
}

/* 课表（今日/明日标签页切换） */
function classesTileHTML(){
  const all=data.timetable||[];
  const dnames=["周一","周二","周三","周四","周五","周六","周日"];
  // 今日 dow（1=周一）
  const today_dow=((new Date().getDay()+6)%7)+1;
  // 明日 dow（处理周日→周一）
  const tomorrow_dow=(today_dow%7)+1;

  const buildCards=(dow)=>{
    const list=all.filter(x=>(x.day||1)===dow).sort((a,b)=>{
      // 固定节次按 period 排，自定义时段按 startTime 排
      const sa=a.customSlot?a.startTime||"z":String(a.period||99).padStart(2,"0");
      const sb=b.customSlot?b.startTime||"z":String(b.period||99).padStart(2,"0");
      return sa.localeCompare(sb);
    });
    if(!list.length) return `<div class="focus-empty">${dnames[dow-1]}没有课程${dow===tomorrow_dow?'，提前准备书本休息一下吧':'，去「学校课表」添加吧'}</div>`;
    return list.map(x=>{
      const isTutoring=x.tag==="tutoring";
      const isCustom=!!x.customSlot;
      const time=isCustom?`${esc(x.startTime||"")}-${esc(x.endTime||"")}`:(TT_PERIOD_TIME[x.period||1]||"");
      const periodLabel=isCustom?`自定义 · ${esc(x.startTime||"")}`:`第${x.period||1}节`;
      return `
      <div class="tc-card ${isTutoring?'tutoring':''} js-pin-open" data-mkey="timetable" data-id="${x.id}">
        <div class="tc-period">${periodLabel}${time?` · ${esc(time)}`:''}${isTutoring?` · <span style="color:var(--module-5);font-weight:700">补习</span>`:''}</div>
        <div class="tc-sub">${esc(x.subject||"未命名")}</div>
        ${x.location?`<div class="tc-loc">${icon("map-pin",10)} ${esc(x.location)}</div>`:''}
        ${x.teacher?`<div class="tc-teacher">${esc(x.teacher)}</div>`:''}
        ${x.note?`<div class="tc-note">${esc(x.note)}</div>`:''}
      </div>`;
    }).join("");
  };

  const todayList=all.filter(x=>(x.day||1)===today_dow);
  const tomorrowList=all.filter(x=>(x.day||1)===tomorrow_dow);
  const todayCells=buildCards(today_dow);
  const tomorrowCells=buildCards(tomorrow_dow);

  // 默认今日激活；明日面板默认隐藏
  return `<div class="tile b12"><div class="tile-h"><span class="tic">${icon("school",16)}</span><div class="tt"><span class="en">CLASS SCHEDULE</span><span class="zh">课表</span></div>
    <div class="seg tt-tabs" id="cls-tabs">
      <div class="opt on" data-v="today">${dnames[today_dow-1]} · 今日 ${todayList.length}节</div>
      <div class="opt" data-v="tomorrow">${dnames[tomorrow_dow-1]} · 明日 ${tomorrowList.length}节</div>
    </div></div>
    <div class="tc-panel" id="cls-today"><div class="tc-strip">${todayCells}</div></div>
    <div class="tc-panel" id="cls-tomorrow" style="display:none"><div class="tc-strip">${tomorrowCells}</div></div>
    <div class="tt-foot" style="font-size:11px;color:var(--text-secondary);padding:8px 12px;border-top:1px dashed var(--border);margin-top:6px">${icon("book",12)} 提示：切换"明日"提前准备所需书本</div>
  </div>`;
}
